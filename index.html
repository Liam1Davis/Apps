  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}

  body{

  /* Subtle dot grid + extra glow layered on top of the existing Aurora
     background gradient (near-black surface it was designed for); kept
     faint enough to never compete with content, and removed at narrow
     widths so it can't muddy small-screen legibility. background-color
     above is the safety net so nothing ever shows through as plain white,
     however tall the page grows. Deliberately NOT background-attachment:
     fixed — that only paints one viewport's worth of image and leaves the
     rest of a long page uncovered. */
  :root[data-theme="aurora"] body{
    background-image:var(--dot-grid), radial-gradient(circle at 52% 6%, rgba(124,58,237,.16), transparent 34%), radial-gradient(ellipse at top, #17102B 0%, #09090E 65%);
    background-size:26px 26px, auto, auto;
    background-repeat:repeat, no-repeat, no-repeat;
  }
  @media (max-width:768px){

  /* ---------- Track fork: Beginner / Experienced ----------
     Both containers stay mounted at all times (never destroyed), so
     switching tracks never loses anything typed into the Experienced
     Studio's fields. #app's own hash-router keeps managing what's
     inside #experienced-track independently of this. */
  #landing-fork,
  #beginner-track,
  #experienced-track{
    opacity:0;
    transition:opacity .22s ease;
  }
  #landing-fork.track-visible,
  #beginner-track.track-visible,
  #experienced-track.track-visible{
    opacity:1;
  }
  @media (prefers-reduced-motion: reduce){
    #landing-fork,
    #beginner-track,
    #experienced-track{transition:none;}
  }
  .fork-card .btn{align-self:flex-start;}

  /* ---------- Track switch control (topbar) ---------- */
  .track-switch{
    display:inline-flex;
    align-items:center;
    gap:2px;
    padding:3px;
    border-radius:999px;
    background:var(--btn-tint-bg, var(--btn-secondary-bg));
    border:1px solid var(--border);
  }
  .track-switch-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:.78rem;
    font-weight:600;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background-color .16s ease, color .16s ease;
  }
  .track-switch-btn:hover{color:var(--text);}
  .track-switch-btn.is-active{
    background:var(--accent);
    color:#fff;
  }
  /* Deep Aurora Glass neon glow on whichever track is currently active —
     same rgba(192,132,252,...) glow used on .card:hover and .btn.primary
     elsewhere, so the active tab reads as "lit up" rather than just
     tinted a solid colour. */
  :root[data-theme="aurora"] .track-switch-btn.is-active{
    box-shadow:0 0 14px rgba(192,132,252,.55);
  }
  @media (max-width:600px){
    .topbar{flex-wrap:wrap; row-gap:8px;}

    line-height:1.45;
  }
  .section-label{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-weight:700;
    color:var(--muted);
    margin:0 0 14px;
  }
  @media (max-width:720px){
    .feature-row{grid-template-columns:1fr;gap:16px;padding:18px;}
    .feature-item + .feature-item{border-left:none;border-top:1px solid var(--border);padding-top:16px;}
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
    align-items:stretch;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--card-accent, var(--accent));
    border-radius:var(--radius);
    padding:20px;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow-card);
    transition:transform .18s ease, box-shadow .18s ease, background-color .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -6px rgba(15,23,42,.16);}
  :root[data-theme="aurora"] .card:hover{box-shadow:0 0 26px rgba(192,132,252,.22);}
  @media (prefers-reduced-motion: reduce){
    .card:hover{transform:none;}
  }
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .card-tag{
    display:inline-block;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--card-tag-text);
    background:var(--card-tag-bg);
    padding:3px 8px;
    border-radius:20px;
    align-self:flex-start;
  }
  .card-motif{flex:none;color:var(--card-accent, var(--accent));opacity:.85;}
  .card-motif svg{display:block;width:28px;height:28px;}

  /* ---------- "Feeling overwhelmed?" fallback banner (Experienced home) ----------
     Sits directly above the framework selector so anyone who lands in the
     Experienced Studio first, and finds RISE/RACE-style acronyms
     off-putting, has an immediate, low-friction way back to the guided
     track. Shares the Deep Aurora Glass panel/blur/glow tokens the rest
     of the app uses rather than duplicating them. */
  .fallback-banner{
    display:flex;
    gap:16px;
    align-items:flex-start;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    margin:24px 0;
    box-shadow:var(--shadow-card);
  }
  :root[data-theme="aurora"] .fallback-banner{
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .fallback-banner-icon{
    flex:none;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.3rem;
    background:var(--card-tag-bg);
  }
  .fallback-banner-content h2{margin:0 0 6px;font-size:1.1rem;font-family:var(--heading-font);}
  .fallback-banner-content p{margin:0 0 14px;font-size:.88rem;color:var(--muted);line-height:1.55;}
  @media (max-width:600px){
    .fallback-banner{flex-direction:column;padding:18px;}
  }

  /* ---------- In-form "Confused by these fields?" helper link ---------- */
  .fw-confused-link{
    margin:0 0 14px;
    font-size:.83rem;
    color:var(--muted);
  }
  .fw-confused-link a{
    color:var(--accent);
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
  }
  .fw-confused-link a:hover{color:var(--accent-dark);}

  .card h2{
    margin:0 0 8px;
    font-size:1.25rem;
    font-family:var(--heading-font);
  }
  .card p{
    color:var(--muted);
    font-size:.92rem;
    flex-grow:1;
    margin:0 0 16px;
  }
  .home-footer{
    margin-top:36px;
  }

  /* ---------- File-saving info strip: compact two-pill mini grid ----------
     Replaces the old single wide callout card. Two small glass pills sit
     side-by-side (stacking on narrow screens), each covering one fact —
     scannable at a glance rather than a paragraph to read. Uses the same
     themed tokens as the rest of the UI (--btn-tint-bg / --card-tag-bg /
     --border) so it automatically matches all three themes, and gets the
     Aurora glass blur + neon hover glow the same way .card does. */
  .archive-info-block{
    margin:18px 0;
  }
  .archive-info-title{
    margin:0 0 4px;
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
  }
  .archive-info-intro{
    margin:0 0 10px;
    font-size:.82rem;
    line-height:1.5;
    color:var(--text);
  }
  .archive-info-intro .filename-badge{margin:0 2px;}
  .archive-info-strip{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:10px;
  }
  .archive-pill{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px 14px;
    background:var(--btn-tint-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    transition:border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .archive-pill:hover{
    border-color:var(--accent);
    background:var(--btn-tint-hover);
  }
  :root[data-theme="aurora"] .archive-pill{
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  :root[data-theme="aurora"] .archive-pill:hover{
    box-shadow:0 0 20px rgba(192,132,252,.22);
  }
  .pill-icon{
    flex:none;
    width:30px;
    height:30px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--card-tag-bg);
    color:var(--card-tag-text);
  }
  .pill-icon svg{display:block;}
  .pill-content{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .pill-title{
    font-size:.83rem;
    font-weight:700;
    color:var(--text);
  }
  .pill-desc{
    font-size:.76rem;
    line-height:1.42;
    color:var(--muted);
  }
  .filename-badge{
    font-family:var(--font-mono);
    font-size:.72rem;
    padding:1px 5px;
    border-radius:4px;
    background:var(--code-bg);
    border:1px solid var(--border);
    color:var(--text);
    white-space:nowrap;
  }
  @media (max-width:600px){
    .archive-info-strip{margin:14px 0;}
  }

  /* ==========================================================================
     Beginner Track — "Prompt Apprenticeship" (Acts 1-4)
     A guided, narrative walkthrough for people new to prompting. Reuses the
     same Deep Aurora Glass tokens as the rest of the app (--panel, --border,
     --accent, --btn-tint-bg, --output-bg) so it automatically matches all
     three themes and gets the Aurora glass blur the same way .card/.fields
     already do.
     ========================================================================== */
  .act-scenario-text{margin:0 0 16px;font-size:.92rem;color:var(--text);line-height:1.55;}

  /* --- Top progress tracker: 25% -> 100% across the 4 acts --- */
  .apprentice-progress{margin:20px 0 28px;}
  .apprentice-progress-track{
    width:100%;
    height:8px;
    border-radius:5px;
    background:var(--btn-secondary-bg);
    overflow:hidden;
    margin-bottom:14px;
  }
  .apprentice-progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:5px;
    transition:width .35s ease;
  }
  .apprentice-progress-steps{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
  }
  .apprentice-step{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:.76rem;
    font-weight:700;
    color:var(--muted);
  }
  .apprentice-step-dot{
    flex:none;
    width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.68rem;
    font-weight:800;
    background:var(--btn-secondary-bg);
    color:var(--muted);
  }
  .apprentice-step.is-active .apprentice-step-dot,
  .apprentice-step.is-complete .apprentice-step-dot{
    background:var(--accent);
    color:#fff;
  }
  .apprentice-step.is-active,
  .apprentice-step.is-complete{color:var(--text);}
  @media (max-width:700px){
    .apprentice-progress-steps{grid-template-columns:repeat(2, 1fr);row-gap:10px;}
  }
  @media (max-width:420px){
    .apprentice-step .step-label-text{display:none;}
  }

  /* --- Act panels --- */
  .act-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px 24px;
    margin-bottom:20px;
    box-shadow:var(--shadow-card);
    transition:opacity .25s ease;
  }
  :root[data-theme="aurora"] .act-panel{
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .act-panel.is-locked{opacity:.55;}
  .act-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:4px;
  }
  .act-number-badge{
    flex:none;
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:.95rem;
    background:var(--accent);
    color:#fff;
  }
  .act-panel.is-locked .act-number-badge{
    background:var(--btn-secondary-bg);
    color:var(--muted);
  }
  .act-title-group{display:flex;flex-direction:column;gap:2px;}
  .act-title{margin:0;font-size:1.15rem;font-family:var(--heading-font);}
  .act-subtitle{margin:0;font-size:.8rem;color:var(--muted);}
  .act-complete-tag{
    margin-left:auto;
    flex:none;
    font-size:.72rem;
    font-weight:700;
    color:var(--success-text);
    background:var(--success-bg);
    padding:3px 10px;
    border-radius:999px;
  }
  .act-locked-msg{
    margin:10px 0 0;
    font-size:.85rem;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .act-body{margin-top:16px;}

  /* --- Act intro note (plain callout ahead of the challenge exercise) --- */
  .act-intro-note{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:16px;
  }
  .act-intro-note p{margin:0;font-size:.92rem;color:var(--text);line-height:1.55;}

  /* --- Lesson callout (reused as the "What to remember" box) --- */
  .lesson-callout{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:var(--btn-tint-bg);
    border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:14px 16px;
    margin-top:16px;
  }
  .lesson-callout-icon{flex:none;font-size:1.1rem;line-height:1;}
  .lesson-callout p{margin:0;font-size:.88rem;color:var(--text);line-height:1.55;}
  .lesson-callout strong{color:var(--accent);}

  /* --- Beginner multiple-choice learning checks (the "challenge" engine
     shared by Acts 1-4): a scenario, 3 candidate prompts as large radio
     cards, a Check-my-answer gate, and non-punitive feedback (success
     green for the right answer, a neutral amber — never red — for the
     other two). chip-btn / dial-label / assembly-window-label below are
     also used by the Beginner Prompt Builder further down the page. --- */
  .challenge-step-label{
    margin:0 0 14px;
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .challenge-heading{margin:0 0 6px;font-size:1rem;font-weight:750;color:var(--text);}
  .challenge-scenario{margin:0 0 16px;font-size:.92rem;color:var(--text);line-height:1.55;}
  .challenge-question{margin:0 0 14px;font-size:.92rem;font-weight:700;color:var(--text);}
  .challenge-fieldset{border:0;padding:0;margin:0 0 16px;}
  .challenge-legend{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .challenge-options{display:flex;flex-direction:column;gap:10px;}
  .challenge-option-card{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--input-bg);
    cursor:pointer;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .challenge-option-card:hover{border-color:var(--accent);}
  .challenge-option-card.is-selected{border-color:var(--accent);background:var(--btn-tint-bg);}
  .challenge-option-card.is-disabled{cursor:not-allowed;opacity:.7;}
  .challenge-option-card input[type="radio"]{
    flex:none;
    width:20px;
    height:20px;
    margin-top:1px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .challenge-option-card input[type="radio"]:disabled{cursor:not-allowed;}
  .challenge-option-card input[type="radio"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .challenge-option-text{font-size:.9rem;line-height:1.5;color:var(--text);}
  .challenge-check-btn{margin-bottom:6px;}
  .challenge-feedback{
    display:flex;
    gap:12px;
    align-items:flex-start;
    border-radius:10px;
    padding:14px 16px;
    margin:16px 0;
    font-size:.88rem;
    line-height:1.55;
  }
  .challenge-feedback.is-correct{background:var(--success-bg);color:var(--success-text);}
  .challenge-feedback.is-incorrect{background:var(--warning-bg);color:var(--warning-text);}
  .challenge-feedback-icon{flex:none;font-size:1.05rem;line-height:1.4;}
  .challenge-feedback-text{margin:0;color:inherit;}
  .challenge-feedback-text strong{color:inherit;}
  .challenge-retry-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:-6px 0 16px;}
  .challenge-retry-btn,.challenge-reveal-link{
    font:inherit;
    font-size:.83rem;
    font-weight:600;
    color:var(--accent);
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .challenge-actions{margin-top:6px;}
  .challenge-reset-row{display:flex;justify-content:flex-end;margin:-8px 0 18px;}
  .challenge-reset-btn{
    font:inherit;
    font-size:.8rem;
    font-weight:600;
    color:var(--muted);
    background:none;
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .challenge-reset-btn:hover{border-color:var(--accent);color:var(--accent);}
  .challenge-reset-btn.is-confirming{border-color:var(--warning-text);color:var(--warning-text);}

  /* --- Final recap table (end of the four exercises) --- */
  .challenge-recap-table-wrap{overflow-x:auto;margin-bottom:16px;}
  .challenge-recap-table{width:100%;border-collapse:collapse;font-size:.85rem;}
  .challenge-recap-table th{
    text-align:left;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    padding:8px 12px;
    border-bottom:2px solid var(--border);
  }
  .challenge-recap-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    color:var(--text);
  }
  .challenge-recap-table tr:last-child td{border-bottom:none;}

  /* --- Shared dial-style labels (Act 3 audience dial + the Beginner
     Prompt Builder's own block labels further down the page) --- */
  .dial-label{
    display:block;
    margin:0 0 8px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-btn{
    font:inherit;
    cursor:pointer;
    padding:7px 13px;
    font-size:.8rem;
    font-weight:600;
    border-radius:999px;
    border:1px dashed var(--border);
    background:transparent;
    color:var(--muted);
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip-btn:hover{border-color:var(--accent);}
  .chip-btn.is-active{
    border:1px solid var(--accent);
    background:var(--btn-tint-bg);
    color:var(--accent);
  }
  .assembly-window-label{
    display:block;
    margin:0 0 8px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* --- Recap-and-bridge banner (end of the four challenge exercises) --- */
  .apprentice-graduate{
    margin-top:18px;
    padding:18px;
    border-radius:var(--radius-lg);
    background:var(--btn-tint-bg);
    border:1px solid var(--border);
    text-align:center;
  }
  .apprentice-graduate p{margin:0 0 14px;font-size:.92rem;color:var(--text);}

  @media (max-width:600px){
    .act-panel{padding:18px 16px;}
    .act-header{gap:10px;}
    .act-title{font-size:1.05rem;}
  }

  /* --- Beginner Prompt Builder: open sandbox below Act 4 --- */
  .rpb-body{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:900px){
    .rpb-body{grid-template-columns:1fr;}
  }
  .rpb-form{display:flex;flex-direction:column;gap:20px;}
  .rpb-block{display:flex;flex-direction:column;gap:8px;}
  .rpb-input{
    width:100%;
    font-family:inherit;
    font-size:16px; /* 16px minimum avoids automatic zoom on iOS Safari */
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--input-bg);
    color:var(--text);
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .rpb-input::placeholder{color:var(--muted);opacity:.75;}
  .rpb-input:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--input-focus-bg);
    box-shadow:var(--focus-ring);
  }
  select.rpb-input{cursor:pointer;}
  /* The dropdown's OPEN option list is a separate, opaque OS-level popup —
     pair <option> with the solid --bg/--text tokens so it never turns
     nearly invisible against a translucent --input-bg. */
  select.rpb-input option{
    background-color:var(--bg);
    color:var(--text);
  }
  textarea.rpb-input{resize:vertical;}
  .rpb-custom-rule{margin-top:2px;}
  .rpb-assembly-card{
    position:sticky;
    top:96px;
    background:var(--readiness-bg);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow-card);
  }
  @media (max-width:900px){
    .rpb-assembly-card{position:static;}
  }
  .rpb-assembly-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .rpb-word-count{
    font-size:.76rem;
    font-weight:700;
    color:var(--muted);
    font-family:var(--font-mono);
    white-space:nowrap;
  }
  .rpb-assembly-content{
    background:var(--output-bg);
    border:1px solid var(--output-border);
    border-radius:10px;
    padding:14px 16px;
    min-height:90px;
    margin-bottom:14px;
  }
  .rpb-assembly-block{margin-bottom:14px;}
  .rpb-assembly-block:last-child{margin-bottom:0;}
  .rpb-assembly-block p{margin:0;font-size:.87rem;line-height:1.55;color:var(--output-text);}
  .rpb-assembly-empty{margin:0;font-size:.85rem;color:var(--muted);font-style:italic;}
  .rpb-badge{
    display:inline-block;
    font-size:.66rem;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    padding:3px 9px;
    border-radius:6px;
    margin-bottom:6px;
  }
  .rpb-badge-role{background:#2563EB;}
  .rpb-badge-task{background:#7C3AED;}
  .rpb-badge-rules{background:#D97706;}
  .rpb-copy-btn{width:100%;}
  .rpb-copy-btn.is-copied{background:var(--success-text);border-color:var(--success-text);color:#fff;}

  /* ---------- Site-wide developer credit + analytics-badge footer ---------- */
  .site-footer{
    max-width:960px;
    margin:0 auto;
    padding:8px 20px 28px;
    display:flex;
    justify-content:flex-end;
  }
  .footer-credits{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:14px;
  }
  .dev-credit{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:0;
    font-size:.82rem;
    color:var(--muted);
  }
  .dev-logo{
    height:52px;
    width:auto;
    border-radius:5px;
    display:block;
  }
  .analytics-badge{
    margin:0;
    font-size:.78rem;
    color:var(--muted);
    padding-left:14px;
    border-left:1px solid var(--border);
  }
  .analytics-badge a{
    color:var(--muted);
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .analytics-badge a:hover{color:var(--accent);}
  @media (max-width:600px){
    .site-footer{padding:6px 14px 24px;justify-content:center;}
    .footer-credits{justify-content:center;}
    .analytics-badge{padding-left:0;border-left:none;}
  }
  .footer-privacy-link{margin:0;font-size:.82rem;color:var(--muted);}
  .footer-privacy-link a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  .footer-privacy-link a:hover{color:var(--accent);}

  /* ---------- Privacy & Safe AI modal overlay ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(8,6,16,.6);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .modal-overlay:not([hidden]){display:flex;}
  body.modal-open{overflow:hidden;}
  .modal-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:0 20px 60px -12px rgba(0,0,0,.35);
    width:min(640px, 100%);
    max-height:calc(100vh - 80px);
    max-height:calc(100dvh - 80px);
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:26px 28px 30px;
    position:relative;
    outline:none;
  }
  :root[data-theme="aurora"] .modal-card{
    background:rgba(20,14,36,.94);
    border-color:rgba(168,85,247,.4);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 0 40px rgba(168,85,247,.18);
  }
  .modal-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:18px;
  }
  .modal-title{
    font-family:var(--heading-font);
    font-size:1.3rem;
    font-weight:800;
    color:var(--text);
    margin:0;
  }
  .modal-close-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    flex:none;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .modal-close-btn:hover{background:var(--btn-secondary-bg);color:var(--text);}
  .privacy-section{margin-bottom:22px;}
  .privacy-section:last-child{margin-bottom:0;}
  .privacy-section h3{
    font-size:1rem;
    font-weight:750;
    color:var(--text);
    margin:0 0 8px;
  }
  .privacy-section p{
    margin:0 0 8px;
    color:var(--text);
    line-height:1.55;
    font-size:.92rem;
  }
  .privacy-section ul{
    margin:0 0 8px;
    padding-left:20px;
    color:var(--text);
    line-height:1.55;
    font-size:.92rem;
  }
  .privacy-section li{margin-bottom:4px;}
  .privacy-section li:last-child{margin-bottom:0;}
  .privacy-rules li strong{color:var(--text);}
  @media (max-width:600px){
    .modal-overlay{padding:0;align-items:stretch;}
    .modal-card{
      width:100%;
      max-width:100%;
      max-height:100vh;
      height:100%;
      border-radius:0;
      padding:20px 18px 26px;
    }
  }

  /* ---------- Buttons: primary (filled) / secondary (outline) / ghost (text link) ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:8px;
    padding:11px 18px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    background:var(--btn-tint-bg);
    color:var(--accent-dark);
    min-height:40px;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .btn:hover{background:var(--btn-tint-hover);}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.secondary{
    background:transparent;
    color:var(--text);
    box-shadow:inset 0 0 0 1.5px var(--border);
  }
  .btn.secondary:hover{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--btn-tint-bg);}
  .btn.ghost{
    background:transparent;
    color:var(--muted);
    padding-left:6px;
    padding-right:6px;
    min-height:auto;
  }
  .btn.ghost:hover{color:var(--accent);text-decoration:underline;background:transparent;}
  .btn.small{padding:8px 10px;font-size:.8rem;min-height:32px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:disabled:hover{background:var(--btn-tint-bg);}

  /* ---------- Framework page ---------- */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:20px;
    color:var(--accent);
    text-decoration:none;
    font-size:.9rem;
    font-weight:600;
    transition:color .15s ease;
  }
  .back-link:hover{color:var(--accent-dark);text-decoration:underline;}

  /* ---------- Framework identity band ---------- */
  .fw-identity{position:relative;overflow:hidden;}
  .fw-watermark{
    position:absolute;
    top:-0.35em;
    right:-0.05em;
    margin:0;
    font-size:7rem;
    font-weight:800;
    line-height:1;
    letter-spacing:-.03em;
    color:var(--watermark-color);
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
    z-index:0;
  }
  @media (max-width:1099px){ .fw-watermark{font-size:5rem;} }
  @media (max-width:768px){ .fw-watermark{display:none;} }
  .fw-eyebrow-row{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .fw-eyebrow{
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .fw-motif{flex:none;display:inline-flex;color:var(--fw-accent, var(--accent));}
  .fw-motif svg{display:block;width:34px;height:34px;}
  .fw-header{position:relative;z-index:1;}
  .fw-header h1{
    margin-top:0;
    margin-bottom:10px;
    font-size:4.94rem;
  }
  .fw-stageline{
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--fw-accent, var(--accent));
    margin:0 0 12px;
    font-family:var(--font-mono);
  }
  .fw-header .fw-subheader{
    color:var(--muted);
    font-size:1rem;
    max-width:680px;
    margin:0;
  }
  .fw-guide{margin:18px 0 0;position:relative;z-index:1;}
  .fw-guide summary{
    cursor:pointer;
    font-size:.85rem;
    font-weight:700;
    color:var(--fw-accent, var(--accent));
    list-style:none;
    display:inline-block;
  }
  .fw-guide summary::-webkit-details-marker{display:none;}
  .fw-guide summary:hover{text-decoration:underline;}
  .fw-guide-body{
    margin-top:10px;
    background:var(--btn-tint-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    color:var(--text);
    font-size:.88rem;
    line-height:1.6;
  }

  /* ---------- Progress stepper ---------- */
  .fw-stepper-wrap{margin:26px 0 8px;position:relative;z-index:1;}
  .fw-stepper{
    display:flex;
    align-items:flex-start;
    gap:0;
    overflow-x:auto;
    padding-bottom:6px;
    -webkit-overflow-scrolling:touch;
  }
  .fw-step{
    display:flex;
    align-items:center;
    flex:none;
  }
  .fw-step-main{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;}
  .fw-step-dot{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid var(--border);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.62rem;
    font-weight:800;
    font-family:var(--font-mono);
    background:var(--panel);
    transition:background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  .fw-step.is-complete .fw-step-dot{
    background:var(--fw-accent, var(--accent));
    border-color:var(--fw-accent, var(--accent));
    color:#fff;
  }
  .fw-step-label{
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    white-space:nowrap;
  }
  .fw-step.is-complete .fw-step-label{color:var(--text);}
  .fw-step-connector{
    width:32px;
    height:2px;
    background:var(--stepper-line);
    margin:9px 4px 0;
    flex:none;
    transition:background-color .18s ease;
  }
  .fw-step.is-complete + .fw-step .fw-step-connector,
  .fw-step-connector.is-filled{background:var(--fw-accent, var(--accent));}
  @media (max-width:600px){
    .fw-stepper-wrap::after{
      content:"";
      display:block;
    }
    .fw-step-main{min-width:60px;}
    .fw-step-connector{width:18px;}
  }

  /* ---------- Workspace layout: form column + Prompt Readiness column ---------- */
  .fw-workspace{
    display:grid;
    grid-template-columns:1fr;
    gap:26px;
    align-items:start;
    margin-top:22px;
  }
  @media (min-width:1100px){
    .fw-workspace{grid-template-columns:minmax(0,1fr) 300px;}
  }

  /* ---------- Staged fields ---------- */
  .fields{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:6px 20px;
    box-shadow:var(--shadow-card);
    transition:background-color .2s ease, border-color .2s ease;
  }
  .field-row{
    display:flex;
    gap:20px;
    padding:18px 0;
    border-bottom:1px solid var(--border);
    align-items:flex-start;
    border-left:3px solid transparent;
    transition:border-color .18s ease;
  }
  .field-row.is-complete{border-left-color:var(--fw-accent, var(--accent));}
  .field-row:last-child{border-bottom:none;}
  .field-label{
    flex:0 0 34%;
    max-width:34%;
  }
  .field-stage-title{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:4px;
    flex-wrap:wrap;
  }
  .field-stage-num{
    font-family:var(--font-mono);
    font-size:.72rem;
    font-weight:700;
    color:var(--fw-accent, var(--accent));
    flex:none;
  }
  .field-label label{
    display:inline;
    font-weight:600;
    font-size:.95rem;
    color:var(--text);
  }
  .field-help{
    color:var(--muted);
    font-size:.8rem;
    margin-bottom:6px;
  }
  .field-tip{
    color:var(--muted);
    font-size:.76rem;
    font-style:italic;
    margin:0;
  }
  .field-input{flex:1;}
  .field-input textarea{
    width:100%;
    resize:vertical;
    font-family:inherit;
    font-size:16px; /* 16px minimum avoids automatic zoom on iOS Safari */
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--input-bg);
    color:var(--text);
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .field-input textarea::placeholder{color:var(--muted);opacity:.75;}
  .field-input textarea:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--input-focus-bg);
    box-shadow:var(--focus-ring);
  }
  @media (max-width:640px){
    .field-row{flex-direction:column;}
    .field-label{max-width:100%;}
  }

  .action-bar{
    margin-top:22px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .status{
    margin-top:12px;
    font-size:.9rem;
    padding:0;
  }
  .status.success{color:var(--success-text);background:var(--success-bg);padding:9px 12px;border-radius:8px;}
  .status.error{color:var(--error-text);background:var(--error-bg);padding:9px 12px;border-radius:8px;}

  .preview-section{margin-top:28px;}
  .preview-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
  }
  .preview-header-text h3{
    margin:0 0 2px;
    font-size:.78rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text);
    font-weight:800;
  }
  .preview-status-line{
    margin:0;
    font-size:.78rem;
    color:var(--muted);
    font-family:var(--font-mono);
  }
  #preview-box{
    width:100%;
    font-family:var(--font-mono);
    font-size:16px; /* 16px minimum avoids automatic zoom on iOS Safari */
    padding:12px;
    border:1px solid var(--output-border);
    border-radius:8px;
    background:var(--output-bg);
    color:var(--output-text);
    resize:vertical;
    transition:background-color .2s ease, color .2s ease, border-color .2s ease;
  }

  /* ---------- Prompt Readiness panel ---------- */
  .readiness-panel{
    background:var(--readiness-bg);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow-card);
    position:sticky;
    top:96px;
  }
  @media (max-width:1099px){
    .readiness-panel{position:static;}
  }
  .readiness-title{
    margin:0 0 14px;
    font-size:.78rem;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .readiness-fw-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:.85rem;
    font-weight:700;
    color:var(--text);
    padding-bottom:12px;
    margin-bottom:12px;
    border-bottom:1px solid var(--border);
  }
  .readiness-fw-row .fw-accent-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--fw-accent, var(--accent));
    display:inline-block;margin-right:8px;
  }
  .readiness-list{
    list-style:none;
    margin:0 0 16px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .readiness-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:.83rem;
  }
  .readiness-item-name{color:var(--text);}
  .readiness-item-state{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:.75rem;
    font-weight:700;
    white-space:nowrap;
  }
  .readiness-item.is-complete .readiness-item-state{color:var(--success-text);}
  .readiness-item:not(.is-complete) .readiness-item-state{color:var(--muted);}
  .readiness-icon{flex:none;width:14px;height:14px;display:inline-block;}
  .readiness-section{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px;
  }
  .readiness-bar-track{
    width:100%;
    height:8px;
    border-radius:5px;
    background:var(--btn-secondary-bg);
    overflow:hidden;
    margin-bottom:6px;
  }
  .readiness-bar-fill{
    height:100%;
    background:var(--fw-accent, var(--accent));
    border-radius:5px;
    transition:width .25s ease;
  }
  .readiness-count{
    font-size:.8rem;
    color:var(--muted);
    margin:0 0 16px;
  }
  .readiness-next{
    background:var(--btn-tint-bg);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:14px;
  }
  .readiness-next-label{
    font-size:.68rem;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--fw-accent, var(--accent));
    margin:0 0 6px;
  }
  .readiness-next p{margin:0;font-size:.83rem;color:var(--text);line-height:1.5;}
  .readiness-panel .btn{width:100%;}

  /* ---------- Small screens / phones ---------- */
  @media (max-width:600px){
    #app{padding:20px 14px 48px;}
    .home-header h1{font-size:2.21rem;}
    .hero-subtitle{font-size:.95rem;}
    .header-divider{margin:16px 0 20px;}
    .fw-header h1{font-size:3.90rem;}
    .fw-header .fw-subheader{font-size:.92rem;}
    .card{padding:16px;}
    .fields{padding:4px 14px;}
    .action-bar{flex-direction:column;align-items:stretch;}
    .action-bar .btn{width:100%;text-align:center;padding:13px 16px;font-size:1rem;}
    .preview-header{flex-wrap:wrap;gap:8px;}
    .preview-header .btn{padding:10px 14px;}
  }

  /* ==========================================================================
     v2 — AI literacy redesign. Everything below builds on the existing theme
     tokens (--panel, --border, --accent, --btn-tint-bg, --success-*, etc.)
     so all three themes (Studio Slate / Deep Aurora Glass / Warm Editorial)
     keep working without per-theme overrides.
     ========================================================================== */
  :root{
    --good:var(--success-text);
    --good-bg:var(--success-bg);
    --warn:var(--warning-text);
    --warn-bg:var(--warning-bg);
    --miss:var(--error-text);
    --miss-bg:var(--error-bg);
  }
  .shell{max-width:1060px;margin:0 auto;padding:28px 20px 64px;position:relative;}
  @media (max-width:600px){ .shell{padding:20px 16px 48px;} }
  [hidden]{display:none !important;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  input:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Primary navigation (replaces the old two-track switch) ---------- */
  .mainnav{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .mainnav::-webkit-scrollbar{display:none;}
  .nav-link{
    flex:none;font-size:.84rem;font-weight:700;color:var(--muted);text-decoration:none;
    padding:7px 11px;border-radius:999px;white-space:nowrap;
    transition:color .15s ease, background-color .15s ease;
  }
  .nav-link:hover{color:var(--text);background:var(--btn-secondary-bg);}
  .nav-link.current{color:#fff;background:var(--accent);}
  :root[data-theme="aurora"] .nav-link.current{box-shadow:0 0 14px rgba(192,132,252,.45);}
  .nav-link.start{border:1px solid var(--accent);color:var(--accent);}
  .nav-link.start.current{color:#fff;}
  @media (max-width:1020px){
    .topbar{flex-wrap:wrap;row-gap:8px;}
    .mainnav{order:3;width:100%;padding-bottom:2px;}
  }

  /* ---------- Page hero ---------- */
  .page-hero{margin:8px 0 26px;}
  .eyebrow{margin:0 0 8px;font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);}
  .page-hero h1{margin:0 0 10px;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.1;font-weight:800;letter-spacing:-.02em;font-family:var(--heading-font);color:var(--text);}
  .page-hero .lede{margin:0;font-size:1.08rem;line-height:1.55;color:var(--muted);max-width:680px;}
  .page-hero .lede strong{color:var(--text);}
  h2.section-title{font-family:var(--heading-font);font-size:1.3rem;margin:34px 0 6px;color:var(--text);}
  p.section-intro{margin:0 0 16px;color:var(--muted);font-size:.95rem;max-width:720px;line-height:1.55;}
  .muted{color:var(--muted);}
  .small{font-size:.84rem;}
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-card);
  }
  :root[data-theme="aurora"] .panel{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  @media (max-width:600px){ .panel{padding:18px 16px;} }
  .panel h2, .panel h3{font-family:var(--heading-font);color:var(--text);}
  .panel > h2:first-child, .panel > h3:first-child{margin-top:0;}
  .panel p{line-height:1.6;}
  .text-link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px;background:none;border:none;padding:0;font:inherit;cursor:pointer;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .row.end{justify-content:flex-end;}
  .row.between{justify-content:space-between;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:820px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

  /* ---------- Home ---------- */
  .home-hero{padding:22px 0 8px;}
  .home-hero h1{font-size:clamp(2.2rem,5.6vw,3.6rem);}
  .home-hero .cta-row{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .btn.large{padding:13px 22px;font-size:1rem;border-radius:10px;}
  .route-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;
    display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-card);text-decoration:none;color:inherit;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .route-card:hover{transform:translateY(-2px);border-color:var(--accent);}
  :root[data-theme="aurora"] .route-card{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  :root[data-theme="aurora"] .route-card:hover{box-shadow:0 0 26px rgba(192,132,252,.22);}
  .route-card .route-q{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0;}
  .route-card h3{margin:0;font-size:1.15rem;font-family:var(--heading-font);}
  .route-card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5;flex-grow:1;}
  .route-card .go{font-weight:700;color:var(--accent);font-size:.9rem;}
  @media (prefers-reduced-motion: reduce){ .route-card:hover{transform:none;} }

  .journey{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px;padding:0;list-style:none;}
  .journey li{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .journey li span{padding:6px 10px;border-radius:999px;background:var(--btn-secondary-bg);}
  .journey li:not(:last-child)::after{content:"→";color:var(--muted);opacity:.7;}
  .journey li.hl span{background:var(--accent);color:#fff;}

  /* ---------- Weak vs strong comparisons ---------- */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:820px){ .compare{grid-template-columns:1fr;} }
  .compare-col{display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--input-bg);}
  .compare-col.is-strong{border-color:var(--good);}
  .compare-label{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .compare-col.is-weak .compare-label{color:var(--warn);}
  .compare-col.is-strong .compare-label{color:var(--good);}
  .bubble{border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.55;white-space:pre-wrap;}
  .bubble.you{background:var(--btn-tint-bg);border:1px solid var(--border);}
  .bubble.ai{background:var(--output-bg);color:var(--output-text);border:1px dashed var(--output-border);}
  .bubble-who{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:normal;}
  .bubble.ai .bubble-who{color:inherit;opacity:.7;}
  .disclaimer{font-size:.78rem;color:var(--muted);font-style:italic;margin:10px 0 0;}
  .diff-add{background:var(--good-bg);color:var(--good);border-radius:4px;padding:0 3px;font-weight:600;}

  .principle{
    border-left:4px solid var(--accent);background:var(--btn-tint-bg);border-radius:10px;padding:14px 18px;margin:16px 0;
    font-size:1rem;line-height:1.55;color:var(--text);
  }
  .principle strong{color:var(--accent);}
  .analogy{display:flex;gap:14px;align-items:flex-start;}
  .analogy-icon{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card-tag-bg);color:var(--card-tag-text);font-size:1.3rem;}

  /* ---------- Step progress (Start Here + Guided Builder) ---------- */
  .steps-bar{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap;}
  .steps-bar button{
    font:inherit;font-size:.76rem;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--muted);
    padding:6px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
  }
  .steps-bar button[disabled]{cursor:default;opacity:.55;}
  .steps-bar button.is-done{color:var(--good);border-color:var(--good);}
  .steps-bar button.is-current{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---------- "What changed?" checkbox grid ---------- */
  .check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:12px 0 16px;}
  .check-card{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);cursor:pointer;font-size:.9rem;}
  .check-card:hover{border-color:var(--accent);}
  .check-card input{accent-color:var(--accent);width:18px;height:18px;margin-top:1px;flex:none;}
  .check-card.is-right{border-color:var(--good);background:var(--good-bg);}
  .check-card.is-wrong{border-color:var(--warn);background:var(--warn-bg);}
  .check-card.is-missed{border-style:dashed;border-color:var(--good);}
  .reveal-list{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px;}
  .reveal-list li{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--input-bg);font-size:.9rem;line-height:1.5;}
  .reveal-list li strong{display:block;margin-bottom:2px;color:var(--text);}
  .reveal-list .quote{font-family:var(--font-mono);font-size:.8rem;color:var(--accent);}

  /* ---------- Prompt Readiness ---------- */
  .readiness{display:flex;flex-direction:column;gap:12px;}
  .rd-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .rd-title{margin:0;font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
  .rd-verdict{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .rd-verdict.ready{background:var(--good-bg);color:var(--good);}
  .rd-verdict.nearly{background:var(--warn-bg);color:var(--warn);}
  .rd-verdict.notyet{background:var(--btn-secondary-bg);color:var(--muted);}
  .rd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .rd-item{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:.88rem;line-height:1.4;}
  .rd-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;}
  .rd-item.good .rd-icon{background:var(--good-bg);color:var(--good);}
  .rd-item.warn .rd-icon{background:var(--warn-bg);color:var(--warn);}
  .rd-item.miss .rd-icon{background:var(--miss-bg);color:var(--miss);}
  .rd-item.optional .rd-icon{background:var(--btn-secondary-bg);color:var(--muted);}
  .rd-label{font-weight:700;color:var(--text);}
  .rd-why{display:block;font-size:.8rem;color:var(--muted);margin-top:1px;}
  .rd-summary{margin:0;font-size:.88rem;line-height:1.5;color:var(--text);padding:10px 12px;border-radius:10px;background:var(--btn-tint-bg);}
  .rd-skipped{margin:0;font-size:.78rem;color:var(--muted);}
  .rd-meter{display:flex;gap:3px;}
  .rd-meter span{flex:1;height:6px;border-radius:3px;background:var(--btn-secondary-bg);}
  .rd-meter span.good{background:var(--good);}
  .rd-meter span.warn{background:var(--warn);}

  /* ---------- Builder layout ---------- */
  .workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;}
  @media (max-width:960px){ .workspace{grid-template-columns:1fr;} }
  .side-sticky{position:sticky;top:96px;display:flex;flex-direction:column;gap:14px;}
  @media (max-width:960px){ .side-sticky{position:static;} }
  .seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--border);background:var(--btn-secondary-bg);gap:2px;}
  .seg button, .seg a{font:inherit;font-size:.84rem;font-weight:700;border:none;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;text-decoration:none;}
  .seg .is-active{background:var(--accent);color:#fff;}
  .q-card{display:flex;flex-direction:column;gap:12px;}
  .q-step{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0;}
  .q-title{margin:0;font-size:1.35rem;font-family:var(--heading-font);color:var(--text);line-height:1.25;}
  .q-why{margin:0;font-size:.9rem;color:var(--muted);line-height:1.55;}
  .q-why strong{color:var(--text);}
  .field-label2{display:block;font-size:.8rem;font-weight:700;color:var(--text);margin:0 0 6px;}
  .field-hint{display:block;font-size:.78rem;color:var(--muted);font-weight:500;margin-top:2px;}
  .inp{
    width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;
    background:var(--input-bg);color:var(--text);line-height:1.45;transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .inp::placeholder{color:var(--muted);opacity:.7;}
  .inp:focus{outline:none;border-color:var(--accent);background:var(--input-focus-bg);box-shadow:var(--focus-ring);}
  textarea.inp{resize:vertical;min-height:70px;}
  select.inp{cursor:pointer;}
  select.inp option{background-color:var(--bg);color:var(--text);}
  .example-box{border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:.84rem;color:var(--muted);line-height:1.5;}
  .example-box strong{color:var(--text);}
  .example-box button{margin-top:6px;}
  .chip-group .chip-btn{border-style:solid;}
  .chip-group.tight{gap:6px;}
  .chip-sub{display:block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px;}
  .type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
  .type-btn{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);cursor:pointer;}
  .type-btn:hover{border-color:var(--accent);}
  .type-btn.is-active{border-color:var(--accent);background:var(--btn-tint-bg);box-shadow:var(--focus-ring);}
  .type-btn b{font-size:.88rem;}
  .type-btn span{font-size:.76rem;color:var(--muted);}
  .detect-note{font-size:.84rem;color:var(--muted);margin:0;}
  .detect-note strong{color:var(--text);}
  .nav-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  .skip-link{font:inherit;font-size:.84rem;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:4px;}
  .quick-field{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
  .quick-field:last-child{border-bottom:none;}
  @media (max-width:700px){ .quick-field{grid-template-columns:1fr;gap:6px;} }
  .quick-field .ql{font-size:.86rem;font-weight:800;color:var(--text);}
  .quick-field .ql small{display:block;font-weight:500;color:var(--muted);font-size:.76rem;margin-top:2px;}
  .tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;vertical-align:middle;}
  .tag.key{background:var(--card-tag-bg);color:var(--card-tag-text);}
  .tag.opt{background:var(--btn-secondary-bg);color:var(--muted);}
  .tag.lvl-beginner{background:var(--good-bg);color:var(--good);}
  .tag.lvl-intermediate{background:var(--warn-bg);color:var(--warn);}
  .tag.lvl-advanced{background:var(--card-tag-bg);color:var(--card-tag-text);}
  details.more{border-top:1px solid var(--border);margin-top:6px;padding-top:6px;}
  details.more > summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--accent);padding:8px 0;list-style:none;}
  details.more > summary::-webkit-details-marker{display:none;}
  details.more > summary::before{content:"+ ";}
  details.more[open] > summary::before{content:"− ";}

  /* ---------- Output: copyable prompt / details / technical settings ---------- */
  .out-block{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--panel);box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:16px;}
  :root[data-theme="aurora"] .out-block{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .out-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .out-head h3{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text);}
  .out-head .sub{font-size:.76rem;color:var(--muted);}
  pre.prompt-out{
    margin:0;padding:16px 18px;white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:.92rem;line-height:1.6;
    background:var(--output-bg);color:var(--output-text);min-height:80px;max-height:520px;overflow:auto;
  }
  pre.prompt-out.empty{color:var(--muted);font-style:italic;}
  .out-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--border);align-items:center;}
  .out-actions .status{margin:0;flex-basis:100%;}
  .meta-list{list-style:none;margin:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:.86rem;}
  .meta-list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;}
  .meta-list .k{color:var(--muted);}
  .meta-list .v{font-weight:700;color:var(--text);text-align:right;}
  .rel-box{padding:12px 16px;border-top:1px solid var(--border);font-size:.86rem;}
  .rel-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pill{font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:999px;}
  .pill.on{background:var(--good-bg);color:var(--good);}
  .pill.off{background:var(--btn-secondary-bg);color:var(--muted);}
  .pill.plus{background:var(--card-tag-bg);color:var(--card-tag-text);}
  .rel-detail{margin-top:10px;font-size:.84rem;color:var(--muted);line-height:1.55;}
  .rel-detail pre{white-space:pre-wrap;font-family:inherit;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.82rem;}
  .tech-box{padding:12px 16px;font-size:.84rem;color:var(--muted);line-height:1.55;}
  .tech-box table{width:100%;border-collapse:collapse;margin:8px 0;}
  .tech-box td{padding:6px 0;border-bottom:1px solid var(--border);color:var(--text);}
  .tech-box td:first-child{color:var(--muted);width:45%;}
  .accuracy-note{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;line-height:1.5;color:var(--text);padding:12px 14px;border-radius:10px;background:var(--btn-tint-bg);border:1px solid var(--border);}
  .accuracy-note b{color:var(--accent);}

  /* ---------- Contextual safety notice ---------- */
  .notice{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.85rem;line-height:1.5;}
  .notice p{margin:0;}
  .notice .btn{margin-top:6px;}
  .notice-icon{flex:none;font-weight:900;}

  /* ---------- Review ---------- */
  .review-q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .review-q:last-child{border-bottom:none;}
  @media (max-width:700px){ .review-q{grid-template-columns:1fr;} }
  .review-q .rq-text{font-size:.92rem;font-weight:600;color:var(--text);}
  .review-q .rq-text small{display:block;font-weight:500;color:var(--muted);font-size:.78rem;margin-top:2px;}
  .seg-sm{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .seg-sm label{font-size:.8rem;font-weight:700;padding:7px 11px;cursor:pointer;color:var(--muted);border-right:1px solid var(--border);display:flex;align-items:center;}
  .seg-sm label:last-child{border-right:none;}
  .seg-sm input{position:absolute;opacity:0;pointer-events:none;}
  .seg-sm input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px;}
  .seg-sm label.is-on{background:var(--accent);color:#fff;}
  .finding{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;background:var(--input-bg);}
  .finding.verify{border-left-color:var(--accent);}
  .finding h4{margin:0 0 4px;font-size:.95rem;color:var(--text);}
  .finding p{margin:0 0 6px;font-size:.86rem;color:var(--muted);line-height:1.5;}
  .finding .followup{font-family:var(--font-mono);font-size:.8rem;background:var(--output-bg);color:var(--output-text);border-radius:8px;padding:8px 10px;margin-top:6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .finding .followup button{flex:none;}
  .change-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .change-log li{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--input-bg);}
  .change-log .cl-k{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--good);}
  .change-log .cl-v{font-weight:700;color:var(--text);margin:2px 0 6px;font-size:.92rem;}
  .change-log .cl-why{font-size:.84rem;color:var(--muted);line-height:1.5;}
  .improve-field{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .improve-field label{font-weight:700;font-size:.9rem;color:var(--text);display:block;margin-bottom:2px;}
  .improve-field .why{font-size:.8rem;color:var(--muted);display:block;margin-bottom:8px;}

  /* ---------- Learn ---------- */
  .ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:6px;}
  .ladder li a{
    display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit;
    padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--panel);
    transition:border-color .15s ease, transform .15s ease;
  }
  .ladder li a:hover{border-color:var(--accent);}
  .ladder .lv{font-size:.68rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-align:center;line-height:1.1;}
  .ladder .lv b{display:block;font-size:1.3rem;}
  .ladder .lt{font-weight:800;color:var(--text);font-size:.95rem;}
  .ladder .ld{display:block;font-weight:500;color:var(--muted);font-size:.82rem;}
  .ladder .done{font-size:.75rem;font-weight:800;color:var(--good);}
  .ladder li:nth-child(1) a{margin-right:0;}
  .lesson-index{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;}
  .lesson-link{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);text-decoration:none;color:var(--text);font-weight:700;font-size:.9rem;}
  .lesson-link:hover{border-color:var(--accent);}
  .lesson-link small{color:var(--muted);font-weight:600;white-space:nowrap;}
  .lesson-link .tick{color:var(--good);}
  article.lesson{max-width:760px;}
  article.lesson p, article.lesson li{font-size:1rem;line-height:1.65;color:var(--text);}
  article.lesson h2{font-family:var(--heading-font);font-size:1.2rem;margin:26px 0 8px;}
  article.lesson code, .k-code{font-family:var(--font-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:4px;}
  .takeaway{border:1px solid var(--good);background:var(--good-bg);color:var(--good);border-radius:12px;padding:14px 16px;margin:22px 0;font-size:.95rem;line-height:1.55;}
  .takeaway strong{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}
  .lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:18px;margin-top:26px;}
  .term{border-bottom:1px dotted var(--muted);cursor:help;}
  .glossary dt{font-weight:800;color:var(--text);margin-top:12px;}
  .glossary dd{margin:2px 0 0;color:var(--muted);line-height:1.55;}
  .label-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0;}
  .label-grid div{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.86rem;line-height:1.45;color:var(--muted);}
  .label-grid b{display:block;color:var(--text);}

  /* ---------- Prompt Lab ---------- */
  .fw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
  .fw-tile{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--border);border-top:4px solid var(--card-accent,var(--accent));border-radius:var(--radius-lg);background:var(--panel);box-shadow:var(--shadow-card);}
  .fw-tile h3{margin:0;font-family:var(--heading-font);font-size:1.15rem;display:flex;align-items:center;gap:10px;}
  .fw-tile h3 .card-motif svg{width:24px;height:24px;}
  .fw-tile p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.5;flex-grow:1;}
  .fw-tile .stageline{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--card-accent,var(--accent));}
  .fw-section{margin-bottom:6px;}
  .fw-section h3{font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;font-family:inherit;}
  .fw-section p, .fw-section li{font-size:.92rem;line-height:1.6;color:var(--text);margin:0;}
  .fw-section ul{margin:0;padding-left:20px;}
  .parts-table{width:100%;border-collapse:collapse;font-size:.88rem;}
  .parts-table th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border);}
  .parts-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text);}
  .parts-table td:first-child{font-weight:800;white-space:nowrap;}
  .recommend{border:1px solid var(--accent);background:var(--btn-tint-bg);border-radius:12px;padding:14px 16px;font-size:.9rem;line-height:1.55;}
  .recommend strong{color:var(--accent);}
  .human-ai{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:700px){ .human-ai{grid-template-columns:1fr;} }
  .human-ai div{border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.88rem;line-height:1.5;color:var(--muted);}
  .human-ai b{color:var(--text);display:block;margin-bottom:2px;}
  .lab-fields .field-row textarea{font-size:16px;}

  /* ---------- Safety ---------- */
  .safety-flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin:12px 0;}
  .safety-flow .sf{border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.88rem;line-height:1.5;color:var(--muted);}
  .safety-flow .sf b{display:block;color:var(--text);margin-bottom:4px;}
  .safety-flow .sf.local{border-color:var(--good);}
  .safety-flow .sf.remote{border-color:var(--warn);}
  .safety-flow .arrow{display:flex;align-items:center;font-size:1.4rem;color:var(--muted);}
  @media (max-width:700px){ .safety-flow{grid-template-columns:1fr;} .safety-flow .arrow{justify-content:center;transform:rotate(90deg);} }
  .placeholder-demo{font-family:var(--font-mono);font-size:.84rem;line-height:1.6;}
  .placeholder-demo .ph{background:var(--card-tag-bg);color:var(--card-tag-text);border-radius:4px;padding:0 4px;}

  /* ---------- Footer tweaks ---------- */
  .site-footer{max-width:1060px;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .footer-links{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;}
  .footer-links a{color:var(--muted);}
  .readiness-panel-v2{background:var(--readiness-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);}
  :root[data-theme="aurora"] .readiness-panel-v2{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .scaffold-nudge{font-size:.86rem;}
  .skip-link-top{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;}
  .skip-link-top:focus{left:12px;}
  #view:focus{outline:none;}
</style>
</head>

  const by = { format:[], length:[], tone:[] };
  (chips || []).forEach(id => { for (const g of Object.keys(OUTPUT_CHIPS)){ if (OUTPUT_CHIPS[g].items[id]) by[g].push(OUTPUT_CHIPS[g].items[id]); } });

  if (by.length.length) parts.push('Keep it ' + joinAnd(by.length) + '.');
