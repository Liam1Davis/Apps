  goal: /\b(write|draft|create|make|give|list|explain|summari[sz]e|help|plan|suggest|compare|analy[sz]e|tell|describe|generate|rewrite|translate|design|review|prepare|outline|find|calculate|recommend|produce|brainstorm|turn|convert|check|improve|edit|proofread|teach|show)\b/i,
  context: /\b(because|since|as i|as we|i am|i'm|we are|we're|i have|we have|i've|we've|background|currently|the situation|context|my (team|company|organisation|organization|business|job|role|class|school|project|department|situation)|our (team|company|organisation|organization|business|product|customers?|clients?)|for my|here (is|are) (my|the|our)|following (notes|text|information)|tomorrow|next week|deadline)\b/i,
  audience: /\b((ask|asking|tell|telling|email|emailing|message|messaging|reply to|replying to|write to|writing to|invite|inviting|thank|thanking|remind|reminding) (my|a|an|the|our) (manager|boss|team|client|customer|colleague|friend|teacher|landlord|tutor|line manager|director|staff|students?|parents?)|for (a |an |the |my |our )?([A-Z]{2,} )?(beginners?|starters|joiners|employees|volunteers|members|users|patients|candidates|applicants|leaders|teachers|pupils|residents|visitors|managers?|team|staff|colleagues?|clients?|customers?|students?|learners?|parents?|children|kids|executives?|board|stakeholders?|readers?|audience|public|non-?technical|experts?|newcomers?|someone|people who|year-olds?)|to (my|a|an|the|our) (manager|boss|team|client|customer|colleague|friend|teacher|landlord|tutor|line manager|hr|director)|audience|readers?|aimed at|pitched at|\d+-year-olds?|year-olds?|beginners?|non-?technical|little (previous |prior )?(\w+ )?(experience|knowledge)|no (prior|previous) (experience|knowledge))\b/i,
  requirements: /\b(include|including|cover|covering|mention|must|make sure|ensure|key points|at least|should contain|answer these|address|(\d+|three|two|four|five|six|seven|ten) (benefits|risks|examples|ideas|tips|points|reasons|options|steps|questions|recommendations|bullet points|key))\b/i,
  output: /\b(bullets?|bullet points|table|paragraphs?|\d+[ ,]*words?|words? (long|max|maximum)|sentences?|short|brief|concise|detailed|length|format|tone|headings?|numbered|step-by-step|subject line|one page|under \d+|no more than \d+|friendly|formal|informal|professional|polite|plain english|uk english|casual|warm)\b/i,
  success: /\b(so that|in order to|the goal is|my goal|our goal|the aim is|should help|needs? to (help|persuade|convince|explain|get|make)|outcome|success|so (i|we|they|my|our) (can|could|will)|to help (me|us|them)|purpose|useful for|i want (them|my|the reader) to)\b/i,
  constraints: /\b(avoid|don't|do not|without|only use|no jargon|not include|exclude|stay within|limit|must not|never|no more than|keep it under|within \d+|maximum|max\.? \d+|stick to)\b/i
};
function detectSnippet(dim, text){
  const re = DETECTORS[dim];
  if (!re) return null;
  const m = re.exec(text || '');
  if (!m) return null;
  const start = Math.max(0, m.index - 12), end = Math.min(text.length, m.index + m[0].length + 22);
  let snip = text.slice(start, end).replace(/\s+/g, ' ').trim();
  if (start > 0) snip = '…' + snip;
  if (end < text.length) snip += '…';
  return snip;
}

/* ---------- 3b. Readiness evaluation ----------
   Returns { type, items:[{dim, rel, status, label, why}], verdict, summary,
   keyCount, keyGood, skipped:[...] }. status: good | warn | miss | optional */
function evaluateFields(S){
  const type = S.type || detectTaskType(S.goal) || 'other';
  const rel = TASK_TYPES[type].rel;
  const all = [S.goal, S.context, S.audience, S.requirements, outputPhrase(S.outChips, S.outText), S.success, S.constraints].join(' \n ');
  const items = [];
  DIM_ORDER.forEach(dim => {
    if (rel[dim] === 'skip') return;
    const r = fieldStatus(dim, S, all);
    if (rel[dim] === 'opt' && r.status !== 'good') {
      items.push({ dim, rel:'opt', status:'optional', label: DIMENSIONS[dim].name + ' (optional)', why: optionalWhy(dim, type) });
      return;
    }
    items.push(Object.assign({ dim, rel:rel[dim] }, r));
  });
  return finishEvaluation(type, items, S);
}
function fieldStatus(dim, S, all){
  const D = DIMENSIONS[dim];
  const val = dim === 'output' ? outputPhrase(S.outChips, S.outText) : (S[dim] || '');
  const w = countWords(val);
  const covered = () => {
    // Is this dimension already covered somewhere else the learner wrote?
    const others = all.replace(val, ' ');
    const snip = detectSnippet(dim, others);
    if (!snip) return null;
    // A named reader is a strong signal; a passing "short" or "include" is only a partial answer.
    return dim === 'audience'
      ? { status:'good', label: D.good, why:`Already covered elsewhere in your prompt (“${snip}”), so no need to repeat it.` }
      : { status:'warn', label: D.warn, why:`Partly covered (“${snip}”). ${D.why}` };
  };
  if (dim === 'goal'){
    if (!w) return { status:'miss', label:D.miss, why:'Start by saying what you want AI to do. Everything else builds on this.' };
    if (w < 4) return { status:'warn', label:D.warn, why:'Say what you want produced and what it\'s about (e.g. “Write a short email to…” rather than “email”).' };
    return { status:'good', label:D.good, why:'AI knows what you want it to produce.' };
  }
  if (!w){
    if (dim !== 'context'){ const c = covered(); if (c) return c; }
    return { status:'miss', label:D.miss, why:D.why };
  }
  if (dim === 'context' && w < 6) return { status:'warn', label:D.warn, why:'A little more detail would help: the situation, key facts or what\'s already been decided.' };
  if (dim === 'audience' && /^(people|everyone|anyone|users?|the public)$/i.test(val.trim())) return { status:'warn', label:D.warn, why:'“Everyone” is hard to write for. Who is the main reader, and how much do they already know?' };
  if (dim === 'output' && (S.outChips || []).length === 1 && countWords(S.outText) < 3) return { status:'warn', label:D.warn, why:'You\'ve set one thing. Adding format or length as well usually makes the answer easier to use.' };
  if (dim === 'success' && w < 4) return { status:'warn', label:D.warn, why:'Describe what a good answer would let you or the reader do.' };
  return { status:'good', label:D.good, why: goodWhy(dim) };
}
function goodWhy(dim){
  return {
    context:'AI has the background it needs instead of guessing.',
    audience:'AI can pitch the language and detail at the right level.',
    requirements:'AI knows what a complete answer must contain.',
    output:'AI knows what the finished answer should look like.',
    success:'AI knows what the answer needs to achieve.',
    constraints:'AI knows what to avoid or stay within.'
  }[dim] || '';
}
function optionalWhy(dim, type){
  const t = TASK_TYPES[type].name.toLowerCase();
  return {
    context:'Optional here. Add background only if the answer depends on your situation.',
    audience:`Not essential to ${t}, but useful if someone else will read the result.`,
    requirements:'Optional. Add must-haves only if there are specific points to cover.',
    output:'Optional. Add a format or length if you have a preference.',
    success:'Optional. Useful if the answer has a specific job to do.',
    constraints:'Optional. Add limits only if there\'s something to avoid.'
  }[dim] || 'Optional for this task.';
}

/* Free-text version (Readiness checker / Review) */
function evaluateText(text, forcedType){
  const t = (text || '').trim();
  const type = forcedType || detectTaskType(t) || 'other';
  const rel = TASK_TYPES[type].rel;
  const words = countWords(t);
  const items = [];
  DIM_ORDER.forEach(dim => {
    if (rel[dim] === 'skip') return;
    const D = DIMENSIONS[dim];
    let r;
    const snip = detectSnippet(dim, t);
    if (dim === 'goal'){
      if (!words) r = { status:'miss', label:D.miss, why:'Write or paste a request to check it.' };
      else if (words < 4) r = { status:'warn', label:D.warn, why:'Very short requests leave AI to guess almost everything. Say what you want and what it\'s about.' };
      else if (!snip) r = { status:'warn', label:D.warn, why:'We couldn\'t spot a clear instruction (e.g. “Write…”, “Explain…”, “Compare…”). Starting with what you want AI to do helps.' };
      else r = { status:'good', label:D.good, why:`Clear instruction found (“${snip}”).` };
    } else if (dim === 'context'){
      if (snip && words >= 15) r = { status:'good', label:D.good, why:`Background found (“${snip}”).` };
      else if (words >= 30) r = { status:'good', label:D.good, why:'Plenty of specific detail for AI to work from.' };
      else if (snip || words >= 15) r = { status:'warn', label:D.warn, why:'There\'s a little background. A sentence on the situation or key facts would help AI more.' };
      else r = { status:'miss', label:D.miss, why:D.why };
    } else {
      r = snip ? { status:'good', label:D.good, why:`Found: “${snip}”.` } : { status:'miss', label:D.miss, why:D.why };
    }
    if (rel[dim] === 'opt' && r.status !== 'good') r = { status:'optional', label: D.name + ' (optional)', why: optionalWhy(dim, type) };
    items.push(Object.assign({ dim, rel:rel[dim] }, r));
  });
  return finishEvaluation(type, items, { goal:t });
}

function finishEvaluation(type, items, S){
  const keys = items.filter(i => i.rel === 'key');
  const keyGood = keys.filter(i => i.status === 'good').length;
  const gaps = keys.filter(i => i.status !== 'good');
  const misses = keys.filter(i => i.status === 'miss');
  const skipped = DIM_ORDER.filter(d => TASK_TYPES[type].rel[d] === 'skip').map(d => DIMENSIONS[d].name);
  let verdict, summary;
  const goalItem = items.find(i => i.dim === 'goal');
  if (!goalItem || goalItem.status === 'miss'){
    verdict = 'notyet';
    summary = 'Start with your goal: what do you want AI to do?';
  } else if (!gaps.length){
    verdict = 'ready';
    summary = type === 'question'
      ? 'Ready. This is a simple request, so a clear question is all it needs. Adding more wouldn\'t make it better.'
      : 'Ready. Your prompt gives AI the information this task needs. Remember to check the answer before you rely on it.';
  } else if (gaps.length <= 2 && misses.length <= 1 && keyGood >= Math.ceil(keys.length / 2)){
    verdict = 'nearly';
    summary = `Your prompt is nearly ready. Adding ${joinAnd(gaps.map(g => DIMENSIONS[g.dim].gap))} would help AI produce a more useful response.`;
  } else {
    verdict = 'notyet';
    summary = `Not ready yet. AI would have to guess ${joinAnd(gaps.slice(0, 3).map(g => DIMENSIONS[g.dim].gap))}${gaps.length > 3 ? ' and more' : ''}. Answer those and the response will be far more useful.`;
  }
  return { type, items, verdict, summary, keyCount:keys.length, keyGood, gaps:gaps.map(g => g.dim), skipped };
}
const VERDICT_LABEL = { ready:'Ready', nearly:'Nearly ready', notyet:'Not ready yet' };

function readinessHTML(ev, opts){
  opts = opts || {};
  const icon = { good:'✓', warn:'!', miss:'✕', optional:'–' };
  const keyItems = ev.items.filter(i => i.rel === 'key');
  const meter = keyItems.map(i => `<span class="${i.status === 'good' ? 'good' : i.status === 'warn' ? 'warn' : ''}"></span>`).join('');
  const list = ev.items.map(i => `
    <li class="rd-item ${i.status}">
      <span class="rd-icon" aria-hidden="true">${icon[i.status]}</span>
      <span><span class="rd-label">${escapeHtml(i.label)}</span>${opts.compact ? '' : `<span class="rd-why">${escapeHtml(i.why)}</span>`}</span>
    </li>`).join('');
  return `
    <div class="readiness" aria-live="polite">
      <div class="rd-head">
        <p class="rd-title">Prompt readiness</p>
        <span class="rd-verdict ${ev.verdict}">${VERDICT_LABEL[ev.verdict]}</span>
      </div>
      <div class="rd-meter" aria-hidden="true">${meter}</div>
      <p class="sr-only">${ev.keyGood} of ${ev.keyCount} key areas covered.</p>
      <ul class="rd-list">${list}</ul>
      <p class="rd-summary">${escapeHtml(ev.summary)}</p>
      ${ev.skipped.length ? `<p class="rd-skipped">Not needed for “${escapeHtml(TASK_TYPES[ev.type].name.toLowerCase())}”: ${escapeHtml(ev.skipped.join(', '))}. Leaving them out keeps the prompt focused.</p>` : ''}
    </div>`;
}

/* ---------- 4. Reliability layer ----------
   Behavioural guidance that encourages accuracy, transparency and
   appropriate uncertainty. It does NOT prevent hallucinations, and the UI
   never claims it does. Proportional: none → light → standard → enhanced. */
const RELIABILITY_STANDARD = [
  'Prioritise accuracy. Do not invent facts, figures, quotes, sources or links.',
  'If something is uncertain, unknown or cannot be checked, say so rather than presenting a guess as fact.',
  'Where it matters, make clear which points are facts, which are assumptions or estimates, and which are opinions.',
  '__FOLLOW__',
  'Use clear, direct language. Avoid filler, repetition and overconfident claims.',
  'If important information is missing and would significantly change your answer, ask me before guessing.'
];
const RELIABILITY_LIGHT = {
  message: 'Don\'t invent details I haven\'t given you (such as names, dates or figures). Use a [placeholder] where something is missing.',
  default: 'If you\'re not sure about something, say so rather than guessing.'
};
const RISK_CHECKS = {
  health:'This is a health-related topic. Give general information only, flag anything that depends on individual circumstances, and say when I should check with a pharmacist, GP or other qualified professional.',
  legal:'Laws and rules vary by country and change over time. Say which country\'s rules your answer assumes, and flag anything I should confirm with a qualified adviser or an official source.',
  financial:'Financial rules, rates and products change. Show the figures and assumptions behind any calculation, and flag anything I should confirm with an official source or a regulated adviser.',
  employment:'Workplace policies differ between organisations. Flag anything I should check against my organisation\'s own policy or with HR.'
};
const TASK_CHECKS = {
  facts:'Only mention sources, studies or statistics you are confident exist, and tell me which ones I should verify before relying on them.',
  numbers:'Show the key figures and assumptions behind any calculation or estimate so I can check them.'
};

function complexityOf(S, type){
  const filled = ['context','audience','requirements','success','constraints'].filter(d => (S[d] || '').trim()).length
    + ((S.outChips || []).length || (S.outText || '').trim() ? 1 : 0);
  const words = countWords([S.goal, S.context, S.requirements, S.success, S.constraints, S.outText, S.role, S.example].join(' '));
  let score = TASK_TYPES[type].weight + filled * 0.5 + (words > 90 ? 1 : 0) + (words > 180 ? 1 : 0);
  return { score, level: score < 2.5 ? 'simple' : score < 4.5 ? 'standard' : 'complex', words };
}

/* mode: auto | on | off. Returns { level, lines[], reasons[], title } */
function decideReliability(S, type, mode){
  const text = [S.goal, S.context, S.requirements, S.success, S.constraints, S.outText].join(' ');
  const risks = detectRisks(text);
  const facts = FACTS_RE.test(text);
  const numbers = NUMBERS_RE.test(text);
  const cx = complexityOf(S, type);
  const reasons = [];
  let level;
  if (mode === 'off'){
    return { level:'none', lines:[], reasons:['You switched the reliability layer off.'], risks, cx };
  }
  if (mode === 'on'){
    level = risks.length ? 'enhanced' : 'standard';
    reasons.push('You switched the reliability layer on.');
  } else if (risks.length){
    level = 'enhanced';
    reasons.push(`Your task touches on ${joinAnd(risks.map(r => ({health:'health',legal:'legal matters',financial:'money',employment:'employment matters'})[r]))}, where mistakes can matter, so extra checks were added.`);
  } else if (cx.level === 'simple'){
    if (type === 'ideas'){ level = 'none'; reasons.push('Simple creative tasks don\'t need accuracy rules. They would only add noise.'); }
    else { level = 'light'; reasons.push('This is a simple task, so a single line is enough. A full block would be over-engineering it.'); }
  } else if (['analyse','document','explain','summarise','plan','other'].includes(type) || facts || numbers){
    level = 'standard';
    reasons.push(cx.level === 'complex' ? 'This is a detailed task where accuracy matters, so the standard response guidelines were added.' : 'This task involves information AI could get wrong, so the standard response guidelines were added.');
  } else {
    level = 'light';
    reasons.push('A short reminder not to invent details is all this task needs.');
  }
  let lines = [];
  if (level === 'light'){
    lines = [type === 'message' ? RELIABILITY_LIGHT.message : RELIABILITY_LIGHT.default];
  } else if (level === 'standard' || level === 'enhanced'){
    const hasPrefs = (S.audience || '').trim() || (S.outChips || []).length || (S.outText || '').trim() || (S.constraints || '').trim();
    lines = RELIABILITY_STANDARD.map(l => l === '__FOLLOW__' ? (hasPrefs ? 'Follow the requirements above for audience, format, tone, length and anything to avoid.' : null) : l).filter(Boolean);
    if (facts) lines.push(TASK_CHECKS.facts);
    if (numbers) lines.push(TASK_CHECKS.numbers);
    if (level === 'enhanced') risks.forEach(r => lines.push(RISK_CHECKS[r]));
    if (facts || numbers) reasons.push(`Task-specific check added for ${joinAnd([facts ? 'sources and statistics' : null, numbers ? 'figures and calculations' : null].filter(Boolean))}.`);
  }
  return { level, lines, reasons, risks, cx };
}
const REL_LABEL = { none:'Not needed', light:'Light (one line)', standard:'Applied', enhanced:'Applied + extra checks' };

/* ---------- 5. Prompt assembly ----------
   Readable, proportional, no metadata. Simple tasks → one natural paragraph.
   Bigger tasks → short plain-English sections. Sections only appear when
   there's something to put in them. */
function assemblePrompt(S, rel){
  const type = S.type || detectTaskType(S.goal) || 'other';
  const cx = rel ? rel.cx : complexityOf(S, type);
  const out = outputPhrase(S.outChips, S.outText);
  const reqs = splitLines(S.requirements);
  const cons = splitLines(S.constraints);
  const role = (S.role || '').trim();
  const roleLine = role ? (/^you are\b/i.test(role) ? sentence(role) : `You are ${lowerFirst(stripEnd(role))}.`) : '';
  const relLines = rel ? rel.lines : [];
  if (!(S.goal || '').trim()) return '';

  const sectioned = cx.level !== 'simple' || reqs.length > 2 || countWords(S.context) > 45 || (S.example || '').trim();
  if (!sectioned){
    const bits = [];
    if (roleLine) bits.push(roleLine);
    bits.push(sentence(S.goal));
    if ((S.context || '').trim()) bits.push(sentence(S.context));
    if ((S.audience || '').trim()) bits.push(`It's for ${lowerFirst(stripEnd(S.audience))}.`);
    if (reqs.length) bits.push(`Make sure it includes ${joinAnd(reqs.map(r => lowerFirst(stripEnd(r))))}.`);
    if (out) bits.push(out);
    if ((S.success || '').trim()) bits.push(`A good answer will ${lowerFirst(stripEnd(S.success).replace(/^(a good answer (will|would)|it should)\s+/i, ''))}.`);
    if (cons.length) bits.push(cons.map(c => sentence(c)).join(' '));
    let p = bits.join(' ');
    if (relLines.length) p += '\n\n' + relLines.join(' ');
    return p;
  }
  const blocks = [];
  if (roleLine) blocks.push(roleLine);
  blocks.push(sentence(S.goal));
  if ((S.context || '').trim()) blocks.push('Background:\n' + sentence(S.context));
  if ((S.audience || '').trim()) blocks.push('Who it\'s for:\n' + sentence(S.audience));
  if (reqs.length) blocks.push('Make sure the answer includes:\n' + reqs.map(r => '- ' + sentence(r)).join('\n'));
  if ((S.success || '').trim()) blocks.push('What a good answer looks like:\n' + sentence(S.success));
  if (out) blocks.push('Format:\n' + out);
  if (cons.length) blocks.push('Please avoid / stay within:\n' + cons.map(c => '- ' + sentence(c)).join('\n'));
  if ((S.example || '').trim()) blocks.push('Here is an example of the kind of thing I mean (use it as a guide to style and level, not something to copy):\n"""\n' + S.example.trim() + '\n"""');
  if (relLines.length === 1) blocks.push(relLines[0]);
  else if (relLines.length) blocks.push('Response guidelines:\n' + relLines.map(l => '- ' + l).join('\n'));
  return blocks.join('\n\n');
}

/* ---------- 6a. Privacy checks ---------- */
const PRIVACY_PATTERNS = [
  { id:'email',   label:'an email address',      ph:'[EMAIL]',       re:/[\w.+-]+@[\w-]+\.[\w.-]+/g },
  { id:'phone',   label:'a phone number',        ph:'[PHONE]',       re:/(?:\+44\s?7\d{3}|\b07\d{3})\s?\d{3}\s?\d{3}\b|\b0\d{2,4}[\s-]?\d{3,4}[\s-]?\d{3,4}\b/g },
  { id:'card',    label:'what looks like a card or account number', ph:'[CARD NUMBER]', re:/\b(?:\d[ -]?){13,19}\b/g },
  { id:'sort',    label:'a sort code',           ph:'[SORT CODE]',   re:/\b\d{2}-\d{2}-\d{2}\b/g },
  { id:'ni',      label:'a National Insurance number', ph:'[NI NUMBER]', re:/\b[A-CEGHJ-PR-TW-Z]{2}\s?\d{2}\s?\d{2}\s?\d{2}\s?[A-D]\b/gi },
  { id:'postcode',label:'a postcode',            ph:'[POSTCODE]',    re:/\b[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}\b/g },
  { id:'password',label:'a password',            ph:'[PASSWORD]',    re:/\b(password|passcode|pin)\s*(is|:|=)\s*\S+/gi }
];
function findPrivacyIssues(text){
  const hits = [];
  PRIVACY_PATTERNS.forEach(p => { p.re.lastIndex = 0; if (p.re.test(text || '')) hits.push(p); p.re.lastIndex = 0; });
  return hits;
}
function replaceWithPlaceholders(text, ids){
  let t = text || '';
  PRIVACY_PATTERNS.forEach(p => { if (!ids || ids.includes(p.id)){ p.re.lastIndex = 0; t = t.replace(p.re, p.ph); } });
  return t;
}
function privacyNoticeHTML(hits, fixFn){
  if (!hits.length) return '';
  return `
    <div class="notice" role="note">
      <span class="notice-icon" aria-hidden="true">!</span>
      <div>
        <p><strong>Check before you paste this into an AI tool.</strong> It seems to contain ${escapeHtml(joinAnd(hits.map(h => h.label)))}. When you paste a prompt into an AI service, that company receives it. Swapping personal details for placeholders like ${escapeHtml(hits.map(h => h.ph).join(', '))} usually doesn't change the quality of the answer.</p>
        ${fixFn ? `<button type="button" class="btn small" onclick="${fixFn}">Replace with placeholders</button>` : ''}
        <a class="text-link small" href="#/safety" style="margin-left:8px">Why this matters</a>
      </div>
    </div>`;
}

/* ---------- 6b. Framework recommendation ---------- */
function recommendFramework(text, typeHint){
  const t = (text || '').toLowerCase();
  const type = typeHint || detectTaskType(t) || 'other';
  if (!t.trim()) return null;
  if (/\b(search|browse|look up|web|tool|api|database|spreadsheet lookup)\b/.test(t) && /\b(find|research|gather|book|check)\b/.test(t))
    return { id:'react', reason:'your task involves gathering information or taking actions step by step. ReAct structures a think → act → check loop. It only really works when the AI has tools such as web search.' };
  if (/\b(options?|alternatives?|approaches|which (is|should)|choose between|compare)\b/.test(t))
    return { id:'tot', reason:'you\'re choosing between several possible approaches. Tree-of-Thought asks AI to explore each option and judge them against clear criteria before recommending one.' };
  if (/\b(forecast|exactly|precise|calculate|accurate|double-check|verify)\b/.test(t) && type === 'analyse')
    return { id:'selfconsistency', reason:'getting one reliable answer matters here. Self-Consistency has AI solve the problem in more than one way and compare the results.' };
  if (/\b(design|build|model|strategy|framework|overhaul|from scratch|complex|multi-part)\b/.test(t) && ['plan','analyse','other','document'].includes(type))
    return { id:'leasttomost', reason:'this is a big problem that\'s easier to solve in smaller pieces. Least-to-Most breaks it down and builds up from the simplest part.' };
  if (type === 'analyse')
    return { id:'cot', reason:'your task needs reasoning, not just writing. Chain-of-Thought asks AI to work through the problem in stages before giving its answer.' };
  if (type === 'plan')
    return { id:'rise', reason:'your task is a process with an order to it. RISE (Role, Instructions, Steps, Expectations) makes the steps and the finished result explicit.' };
  if (['document','message','summarise','explain'].includes(type))
    return { id:'race', reason:'the quality of this task depends heavily on background information. RACE (Role, Action, Context, Expectations) puts the context front and centre.' };
  return { id:null, reason:'this looks like a simple request. You don\'t need a framework. A clear request that says what you want is enough.' };
}

/* ==========================================================================
   Prompt Lab teaching layer for each framework.
   - level: beginner | intermediate | advanced (never "better", just more
     specialised)
   - parts[i]: plain-English meaning of field i + which core building block
     it maps to (Goal / Context / Audience / Requirements / Output / Success /
     Constraints), so frameworks are taught as combinations of ideas the
     learner already knows.
   - assemble(v): turns the filled fields into readable instructions. The
     framework NAME never goes into the prompt; it's for the human.
   - importMap[i]: which Builder answer fills field i when importing.
   ========================================================================== */
function lineIf(v, prefix){ return v ? (prefix ? prefix + v : v) : ''; }
function numbered(items){ return items.filter(Boolean).map((s, i) => `${i + 1}. ${stripEnd(s)}`).join('\n'); }
function roleLineOf(v){ if (!v) return ''; return /^you are\b/i.test(v) ? sentence(v) : `You are ${lowerFirst(stripEnd(v))}.`; }
function joinBlocks(arr){ return arr.filter(Boolean).join('\n\n'); }

  'what-is-ai': { title:'What is generative AI?', mins:3,
    body:`<p>Tools like ChatGPT, Claude, Gemini and Copilot are <strong>generative AI</strong>: they generate new text (and sometimes images, code or audio) in response to what you type.</p>
<p>Under the hood they're trained on enormous amounts of text, and they've become very good at producing language that fits a request. That makes them genuinely useful for drafting, summarising, explaining, brainstorming and analysing.</p>
<h2>Two things worth knowing from the start</h2>
<ul><li><strong>They don't know your situation.</strong> They know a lot in general, but nothing about your organisation, your audience or what you need, unless you tell them.</li>

    body:`<p>A <strong>prompt</strong> is simply what you type into an AI tool: your question, request or instructions. “Give me three dinner ideas” is a prompt. So is a carefully written two-paragraph brief.</p>
<p>Imagine you've hired an extremely capable assistant on their first day at work. They can write, analyse, summarise, brainstorm and explain. But they don't know your organisation, your audience, your preferences or what “good” looks like. <strong>The better you brief them, the more useful their work becomes.</strong></p>
<p>A prompt is that brief. Writing good ones isn't about technical tricks. It's the same skill as briefing a person well.</p>

  'why-answers-vary': { title:'Why AI answers vary', mins:3,
    body:`<p>Ask the same question twice and you'll often get two different answers. That's normal, not a fault.</p>
<p>AI builds its answer piece by piece, choosing each next word from many likely options. A little randomness in those choices makes writing sound natural and lets you ask for alternatives.</p>
<h2>What this means for you</h2>
<ul><li><strong>Vague prompts vary more.</strong> When AI has to guess what you want, each guess can be different. Clearer prompts give more consistent results.</li>
<li><strong>Regenerating is fine.</strong> If an answer misses, try again or ask for another version.</li>
<li><strong>Different tools behave differently.</strong> The same prompt may work better in one tool than another.</li></ul>
<h2>Temperature (for the curious)</h2>
<p>Developers can control that randomness with a setting called <strong>temperature</strong> (and a related one, <strong>top-p</strong>). Low values give steadier, more predictable answers. Higher values give more varied, creative ones.</p>

<p>A clear task alone is often enough for simple questions. You'll add more only when the task needs it.</p>`,
    exercise:'specific',
    takeaway:'Start every prompt with what you want AI to do, and what it\'s about.',
    tryIt:{ href:'#/build', label:'Try it in the Guided Builder' } },
  'context': { title:'Add context', mins:3, ladder:2,
    body:`<p>Context is <strong>what AI needs to know</strong> that it can't know already: your situation, the background, key facts, what's already been decided.</p>
<p>It's often the single biggest improvement you can make. Compare:</p>
<div class="compare"><div class="compare-col is-weak"><span class="compare-label">No context</span><div class="bubble you">Write a message cancelling my meeting.</div></div><div class="compare-col is-strong"><span class="compare-label">With context</span><div class="bubble you">Write a message cancelling my 2pm meeting with a new supplier. I'm off sick today. I'd like to rearrange for later this week.</div></div></div>
<h2>How much context?</h2>
<p>Enough that a smart stranger could do the task well. Leave out anything that doesn't affect the answer. Irrelevant detail can distract AI just as it would a person.</p>
<p><strong>Privacy check:</strong> context is where personal details creep in. Use placeholders like [CLIENT] or [COLLEAGUE] instead of real names where you can. <a class="text-link" href="#/safety">Learn more</a>.</p>`,
    exercise:'perspective',
    takeaway:'Tell AI what a capable stranger would need to know. No more, no less.' },
  'audience': { title:'Define the audience', mins:2, ladder:2,
    body:`<p>Who will read or use the answer? The same information should be written very differently for a chief executive, a customer, a new starter or a 10-year-old.</p>
<p>Say who they are and, ideally, <strong>what they already know</strong>: “for HR managers with little AI experience”, “for customers who've never used our app”, “for me: I'm comfortable with Excel but new to formulas”.</p>
<p>If you're the audience, say so. “Explain it to me: I'm a complete beginner” works well.</p>`,
    exercise:'audience',
    takeaway:'Name the reader and their starting point, and AI will match the level and tone.' },
  'requirements': { title:'Set requirements', mins:2, ladder:3,
    body:`<p>Requirements are the <strong>must-haves</strong>: the points to cover, the number of items, the details that must appear.</p>
<p>“Cover three benefits, three risks and three practical examples” turns a vague request into a defined one. AI now knows what a complete answer contains.</p>
<p>Keep them to what genuinely matters. Ten requirements for a short email will make the email worse.</p>`,
    takeaway:'List the must-haves so AI knows what “complete” means.' },
  'outcome': { title:'Set the outcome', mins:2, ladder:3,
    body:`<p>What should the answer <strong>achieve</strong>? This is different from what it contains.</p>
<p>“…so my manager can approve it quickly”, “…so new starters feel confident on day one”, “…to help me decide between the two options”. Each tells AI what to prioritise when there are choices to make.</p>
<p>A useful test: if you can't say what would make the answer useful, you'll find it hard to judge whether it is.</p>`,
    takeaway:'Say what a useful answer would let you (or your reader) do.' },
  'output': { title:'Control the output', mins:3, ladder:4,
    body:`<p>The fourth rung: say what the answer should <strong>look like</strong>.</p>
<ul><li><strong>Format:</strong> bullet points, a table, numbered steps, an email with a subject line</li>
<li><strong>Length:</strong> “under 150 words”, “one page”, “five bullet points”</li>
<li><strong>Tone:</strong> friendly, formal, plain English, encouraging</li></ul>
<p>Without this, AI picks for you, and its default is often longer and more formal than you want.</p>`,
    exercise:'output',
    takeaway:'Format, length and tone decide whether you can use the answer straight away.' },
  'examples': { title:'Give examples', mins:3, ladder:5,
    body:`<p>Sometimes it's easier to <strong>show</strong> than describe. If you want a particular style, structure or level, paste an example.</p>
<div class="bubble you">Write three more product descriptions in the same style as this one:\n"""\nOur oak chopping board is cut from a single piece of FSC-certified timber. Heavy enough to stay put, light enough to lift with one hand.\n"""</div>
<p>Tips:</p>
<ul><li>Say what the example is for: “match the tone”, “use the same structure”.</li>
<li>Say it's a guide, not something to copy, or AI may stick too closely to it.</li>
<li>Two contrasting examples can work better than one.</li>
<li>Check examples for personal or confidential details first.</li></ul>
<p class="muted">You may hear this called <em>few-shot prompting</em>.</p>`,
    takeaway:'When a style is hard to describe, show an example, and say what it\'s an example of.' },
  'evaluate': { title:'Check the answer', mins:3, ladder:6,
    body:`<p>Writing the prompt is half the job. The other half is <strong>judging what comes back</strong>. Ask yourself:</p>
<ul><li>Did it answer the actual question?</li><li>Did it use the context correctly?</li><li>Did it follow the format I asked for?</li><li>Is anything important missing?</li><li>Is the tone right for the reader?</li><li>Has it assumed things I didn't say?</li><li>Does anything need checking before I rely on it?</li></ul>
<p>Each “no” usually points to something the prompt didn't make clear. That tells you exactly what to improve.</p>`,
    exercise:'verify',
    takeaway:'Every disappointing answer is a clue about what your prompt was missing.',
    tryIt:{ href:'#/review', label:'Review a real answer' } },
  'improve': { title:'Improve and try again', mins:3, ladder:7,
    body:`<p>You rarely need to start from scratch. Two good options:</p>
<h2>1. Reply in the same chat</h2>
<p>AI remembers the conversation, so short follow-ups work well:</p>
<ul><li>“That's too formal. Make it warmer and cut it to five sentences.”</li><li>“You've assumed we're a large company. We have 12 staff. Please revise.”</li><li>“Good, but add a section on risks.”</li></ul>
<h2>2. Fix the original prompt</h2>
<p>If you'll reuse the prompt, or the answer went badly wrong, add what was missing (often context, audience or format) and start a fresh chat.</p>
<p>Either way, notice <strong>what</strong> you had to add. Next time, you'll include it from the start. That's how you stop needing a tool like this one.</p>`,
    takeaway:'Follow up for quick fixes. Fix the prompt for things you\'ll reuse. Notice what you had to add.',
    tryIt:{ href:'#/review', label:'Use Prompt Review' } },
  'accuracy': { title:'Accuracy: facts, assumptions and uncertainty', mins:4,
    body:`<p><strong>A better prompt can improve the usefulness of a response, but it does not guarantee that the response is correct.</strong></p>
<p>AI can state wrong information confidently, and occasionally invent sources, quotes or figures. People call this <span class="term" title="When AI produces confident but false or made-up information">hallucination</span>. Good prompts make it less likely. Nothing makes it impossible.</p>
<h2>Learn to tell these apart</h2>
<div class="label-grid">
<div><b>Fact</b>Can be checked against a reliable source.</div>
<div><b>Your information</b>Something you told AI. It's only as accurate as what you gave it.</div>
<div><b>Assumption</b>Something AI took for granted to fill a gap.</div>
<div><b>Estimate</b>A reasoned guess at a number.</div>
<div><b>Opinion</b>A judgement or recommendation.</div>
<div><b>Uncertainty</b>Where AI doesn't (or can't) know.</div></div>
<p>You can ask AI to label these for you. That's part of what this site's <strong>reliability layer</strong> does. But treat the labels as helpful, not guaranteed.</p>
<h2>What to verify</h2>
<p>Anything you'll rely on or share: statistics, names, dates, quotes, legal or medical points, prices, and especially references and links.</p>`,
    classify:true,
    takeaway:'Better prompts make answers more useful, not guaranteed correct. Check what matters.' },
  'when-not': { title:'When not to over-engineer a prompt', mins:2,
    body:`<p><strong>Sometimes the best prompt is simply a clear question.</strong></p>
<p>“What's the capital of Australia?” doesn't need a role, a framework or response guidelines. Neither does “Give me three dinner ideas using chicken and rice.”</p>
<p>A good prompt is <strong>clear + relevant + specific + appropriate</strong>, not long. Over-engineering has real costs: longer answers, more to read, and instructions that pull against each other.</p>
<h2>A quick rule of thumb</h2>
<ul><li>Simple, low-stakes task → one clear sentence.</li><li>Someone else will read it → add audience and tone.</li><li>It matters if it's wrong → add context, requirements and accuracy guidance.</li><li>Complex reasoning or decisions → consider a framework.</li></ul>
<p>This site's builder follows the same rule: it skips questions your task doesn't need and leaves the reliability layer out of simple prompts.</p>`,
    exercise:'proportion',
    takeaway:'Longer ≠ better. Match the effort to the task.' },
  'frameworks': { title:'Prompt frameworks', mins:3, ladder:8,
    body:`<p>Once you know the building blocks (goal, context, audience, requirements, output, success, constraints), frameworks are simply <strong>structured ways of combining them</strong>.</p>
<p>RACE, for example, is Role + Action + Context + Expectations. RISE is Role + Instructions + Steps + Expectations. Others, like Chain-of-Thought, are about <em>how</em> AI should reason.</p>
<div class="principle"><strong>The framework is for you</strong>, to help you remember what to include. <strong>The resulting instructions are for the AI.</strong> AI doesn't need to know you used RACE.</div>
<p>No framework is “the best”. Advanced ones aren't better, just more specialised. Many tasks need none at all.</p>`,
    exercise:'roleQuiz',
    takeaway:'Frameworks are checklists for humans. Pick one only when the task benefits from the structure.',
    tryIt:{ href:'#/lab', label:'Explore the Prompt Lab' } },
  'advanced': { title:'Advanced prompting and key terms', mins:4,
    body:`<p>A few ideas you'll meet as you go further. None are needed for everyday use.</p>
<dl class="glossary">
<dt>System prompt / custom instructions</dt><dd>Standing instructions that apply to every conversation, such as “Custom instructions” in ChatGPT or a “Project” in Claude. Good for preferences you'd otherwise repeat (your role, UK English, preferred format).</dd>
<dt>Tokens</dt><dd>The chunks of text AI reads and writes, roughly ¾ of a word each. Tools have limits on how many they can handle at once, which is why very long documents may get cut off or summarised.</dd>
<dt>Context window</dt><dd>How much text (your prompt, files and the conversation so far) AI can take into account at once.</dd>
<dt>Temperature and top-p</dt><dd>Developer settings that control randomness. Not prompt instructions. <a class="text-link" href="#/learn/why-answers-vary">More</a>.</dd>
<dt>Hallucination</dt><dd>Confident but false or invented output. Reduced by good prompts and verification, never eliminated.</dd>
<dt>Reasoning / thinking modes</dt><dd>Some tools can “think” before answering, which helps with complex problems. Where available, this can matter more than prompt wording.</dd>
<dt>Prompt chaining</dt><dd>Splitting a big task into a sequence of prompts, each using the last result (outline → draft → edit).</dd>
<dt>Few-shot prompting</dt><dd>Giving examples of what you want. <a class="text-link" href="#/learn/examples">More</a>.</dd>
</dl>`,
    takeaway:'You don\'t need the jargon to prompt well, but it helps you read about AI and use more advanced tools.' }
};

/* ---------- Challenge engine (generalised from v1 Acts 1–4) ----------
   Option order is shuffled per page load so the answer isn't always "C".
   Progress is remembered per exercise id. Only the exercise's own container
   is re-rendered, so focus and scroll aren't disturbed. */
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const CH_ORDER = {};
Object.keys(EXERCISES).forEach(id => { CH_ORDER[id] = shuffleArray(EXERCISES[id].options.map(o => o.key)); });
const CH_HOOKS = {};
function chState(){ return store.get('ch', {}); }
function chEntry(id){ const s = chState(); return s[id] || { selected:null, checked:false, revealed:false }; }
function chSave(id, e){ const s = chState(); s[id] = e; store.set('ch', s); }
function challengeHTML(id, label){
  return `<div class="challenge" id="ch-${id}" data-label="${escapeHtml(label || "")}">${challengeInner(id, label)}</div>`;
}
function challengeInner(id, label){
  const ex = EXERCISES[id], e = chEntry(id);
  const sel = e.selected ? ex.options.find(o => o.key === e.selected) : null;
  const ok = !!(sel && sel.correct);
  const correct = ex.options.find(o => o.correct);
  const opts = CH_ORDER[id].map(key => {
    const o = ex.options.find(x => x.key === key);
    const isSel = e.selected === key;
    return `<label class="challenge-option-card${isSel ? ' is-selected' : ''}${e.checked ? ' is-disabled' : ''}" for="ch-${id}-${key}">
      <input type="radio" name="ch-${id}" id="ch-${id}-${key}" value="${key}" ${isSel ? 'checked' : ''} ${e.checked ? 'disabled' : ''} onchange="chSelect('${id}','${key}')">
      <span class="challenge-option-text">${escapeHtml(o.text)}</span></label>`;
  }).join('');
  return `
    <p class="challenge-step-label">${escapeHtml(label || ex.skill)}</p>
    <p class="challenge-scenario">${escapeHtml(ex.challenge)}</p>
    <fieldset class="challenge-fieldset">
      <legend class="challenge-question" style="position:static;width:auto;height:auto;clip:auto;margin:0 0 12px;">${escapeHtml(ex.question)}</legend>
      <div class="challenge-options">${opts}</div>
    </fieldset>
    ${e.checked ? '' : `<button type="button" class="btn primary challenge-check-btn" onclick="chCheck('${id}')" ${e.selected ? '' : 'disabled'}>Check my answer</button>`}
    ${e.checked && sel ? `<div class="challenge-feedback ${ok ? 'is-correct' : 'is-incorrect'}" role="status"><span class="challenge-feedback-icon" aria-hidden="true">${ok ? '✓' : '↻'}</span><p class="challenge-feedback-text">${escapeHtml(sel.feedback)}</p></div>` : ''}
    ${e.revealed && !ok ? `<div class="challenge-feedback is-correct"><span class="challenge-feedback-icon" aria-hidden="true">✓</span><p class="challenge-feedback-text"><strong>The strongest option:</strong> “${escapeHtml(correct.text)}”. ${escapeHtml(correct.feedback)}</p></div>` : ''}
    ${e.checked && !ok ? `<div class="challenge-retry-row"><button type="button" class="challenge-retry-btn" onclick="chRetry('${id}')">Try again</button>${e.revealed ? '' : `<button type="button" class="challenge-reveal-link" onclick="chReveal('${id}')">Show me the strongest option</button>`}</div>` : ''}
    ${e.checked ? `<div class="lesson-callout"><p><strong>What to remember:</strong> ${ex.remember}</p></div>` : ''}
    <div id="ch-${id}-after">${e.checked && CH_HOOKS[id] ? CH_HOOKS[id]() : ''}</div>`;
}
function chRerender(id){ const el = $('ch-' + id); if (el) el.innerHTML = challengeInner(id, el.getAttribute('data-label') || null); }
function chSelect(id, key){
  const e = chEntry(id); if (e.checked) return;
  e.selected = key; chSave(id, e);
  // Patch, don't re-render: keeps native radio keyboard navigation working.
  document.querySelectorAll(`#ch-${id} .challenge-option-card`).forEach(c => {
    const inp = c.querySelector('input'); c.classList.toggle('is-selected', !!inp && inp.value === key);
  });
  const b = document.querySelector(`#ch-${id} .challenge-check-btn`); if (b) b.disabled = false;
}
function chCheck(id){ const e = chEntry(id); if (!e.selected) return; e.checked = true; chSave(id, e); chRerender(id); }
function chRetry(id){ chSave(id, { selected:null, checked:false, revealed:false }); chRerender(id); }
function chReveal(id){ const e = chEntry(id); e.revealed = true; chSave(id, e); chRerender(id); }

/* ---------- Output panel: COPYABLE PROMPT / PROMPT DETAILS / TECHNICAL SETTINGS ---------- */

  opts = opts || {};

    <div id="${p}-privacy"></div>
    <section class="out-block" aria-labelledby="${p}-h">
      <div class="out-head">

      </div>
      <pre class="prompt-out empty" id="${p}-prompt" tabindex="0" aria-live="polite">${escapeHtml(opts.empty || 'Your prompt will appear here as you answer the questions.')}</pre>
      <div class="out-actions">
        <button type="button" class="btn primary" onclick="copyFromEl('${p}-prompt', this)">Copy prompt</button>
        <button type="button" class="btn secondary" onclick="${opts.saveFn}">Save as text file</button>
        ${supportsShare() ? `<button type="button" class="btn secondary" data-share-btn onclick="shareSaved('${p}-status')" disabled>Share…</button>` : ''}
        ${opts.extraButtons || ''}
        <div id="${p}-status" class="status" role="status" aria-live="polite"></div>
      </div>
      <div class="rel-box" id="${p}-rel"></div>
    </section>
    <div class="accuracy-note"><span aria-hidden="true">ⓘ</span><span><b>Before you rely on the answer:</b> a better prompt makes a useful answer more likely, but it can't guarantee it's correct. Check facts, figures, names and sources that matter. <a class="text-link" href="#/review">How to review an answer</a></span></div>
    <section class="out-block" style="margin-top:16px">
      <div class="out-head"><h3>Prompt details</h3><span class="sub">For you, not part of the prompt</span></div>
      <ul class="meta-list" id="${p}-details"></ul>
    </section>
    <details class="out-block more" style="padding:0 16px;margin-top:0">
      <summary>Technical settings (advanced, optional)</summary>
      <div id="${p}-tech"></div>
    </details>`;
}
const REL_MODES = {};
function relControlsHTML(p, rel, mode){
  const m = mode || 'auto';
  const pillClass = rel.level === 'none' ? 'off' : rel.level === 'enhanced' ? 'plus' : 'on';
  const shown = !!REL_MODES[p + ':open'];
  return `
    <div class="rel-status">
      <strong>Reliability layer</strong>
      <span class="pill ${pillClass}">${rel.level === 'none' ? '–' : '✓'} ${escapeHtml(REL_LABEL[rel.level])}</span>
      <span class="seg" role="group" aria-label="Reliability layer setting" style="margin-left:auto">
        ${['auto','on','off'].map(x => `<button type="button" class="${m === x ? 'is-active' : ''}" aria-pressed="${m === x}" onclick="setRelMode('${p}','${x}')">${x === 'auto' ? 'Auto' : x === 'on' ? 'On' : 'Off'}</button>`).join('')}
      </span>
    </div>
    <button type="button" class="text-link small" style="margin-top:8px" aria-expanded="${shown}" onclick="REL_MODES['${p}:open']=!REL_MODES['${p}:open'];refreshAny('${p}')">${shown ? 'Hide details' : 'Show details'}</button>
    ${shown ? `<div class="rel-detail">
      <p style="margin:0 0 6px">${escapeHtml(rel.reasons.join(' '))}</p>
      ${rel.lines.length ? `<pre>${escapeHtml(rel.lines.map(l => '• ' + l).join('\n'))}</pre>` : ''}
      <p style="margin:6px 0 0">This is behavioural guidance that encourages accuracy, transparency and honest uncertainty. It <strong>does not stop AI making mistakes</strong>, so you still need to check what matters. Auto mode only adds it when the task warrants it: simple tasks don't need it.</p>
    </div>` : ''}`;
}
/* Each page that hosts an output panel registers a refresher by prefix. */
const REFRESHERS = {};
function refreshAny(p){ if (REFRESHERS[p]) REFRESHERS[p](); }
function setRelMode(p, mode){
  if (p === 'lab'){ store.set('labRelMode', mode); }
  else { const S = getBuilder(); S.relMode = mode; saveBuilder(S); }

}
function updateOutputPanel(p, d){
  const pre = $(p + '-prompt');
  if (!pre) return;
  if (d.prompt){ pre.textContent = d.prompt; pre.classList.remove('empty'); }
  else { pre.textContent = d.empty || 'Your prompt will appear here as you answer the questions.'; pre.classList.add('empty'); }
  pre.setAttribute('data-copy', d.prompt || '');
  const w = countWords(d.prompt);
  $(p + '-words').textContent = `${w} word${w === 1 ? '' : 's'}`;
  $(p + '-rel').innerHTML = relControlsHTML(p, d.rel, d.relMode);
  $(p + '-details').innerHTML = d.details.map(([k, v]) => `<li><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></li>`).join('');
  $(p + '-tech').innerHTML = technicalSettingsHTML(d.temp, d.tempNote);
  $(p + '-privacy').innerHTML = privacyNoticeHTML(d.privacy || [], d.fixFn);
}
function buildFileContent(prompt, details, temp){
  const bar = '─'.repeat(56);
  return `${prompt}\n\n\n${bar}\nNOTES FOR YOU: not part of the prompt (don't paste below this line)\n${bar}\nSaved: ${nowStamp()}\n${details.map(([k, v]) => `${k}: ${v}`).join('\n')}\nTechnical settings (API / developer tools only, not prompt instructions): temperature ${temp[0]}, top-p 0.9\nReminder: check important facts, figures and sources before relying on the answer.\n`;
}

/* ---------- "Fill the gaps" improver (Readiness checker + Review) ----------
   Never silently rewrites the learner's prompt: their words stay as they
   are, additions are appended and each one is explained. */
const IMPROVE_FIELDS = {
  goal:        { label:'Say more precisely what you want', ph:'e.g. A short email asking to work from home tomorrow', prefix:'To be clear, what I want is: ' },
  context:     { label:'Add the background AI needs', ph:'e.g. I have an appointment tomorrow morning.', prefix:'Background: ' },
  audience:    { label:'Who is the answer for?', ph:'e.g. HR managers with little AI experience', prefix:'Who it\'s for: ' },
  requirements:{ label:'What must the answer include?', ph:'e.g. three benefits, three risks and three examples', prefix:'Make sure the answer includes: ' },
  output:      { label:'What should the answer look like?', ph:'e.g. Bullet points, under 200 words, friendly tone', prefix:'Format: ' },
  success:     { label:'What would make the answer useful?', ph:'e.g. My manager can approve it quickly.', prefix:'A good answer will help with this: ' },
  constraints: { label:'Anything to avoid or stay within?', ph:'e.g. No jargon. Don\'t mention pricing.', prefix:'Please avoid / stay within: ' }
};
const IMPROVE = {}; // per prefix: { base, dims, values, addRel, shown }
function improveHTML(p, base, dims, opts){
  opts = opts || {};
  const st = IMPROVE[p] = IMPROVE[p] && IMPROVE[p].base === base ? Object.assign(IMPROVE[p], { dims }) : { base, dims, values:{}, addRel:false, shown:false };
  if (!dims.length && !opts.offerRel){
    return `<p class="muted">Nothing essential is missing for this kind of task. If the answer still disappoints, use <a class="text-link" href="#/review">Prompt Review</a> to work out why.</p>`;
  }
  const fields = dims.map(d => `
    <div class="improve-field">
      <label for="${p}-imp-${d}">${escapeHtml(IMPROVE_FIELDS[d].label)}</label>
      <span class="why">${escapeHtml(DIMENSIONS[d].why)}</span>
      <textarea class="inp" id="${p}-imp-${d}" rows="2" placeholder="${escapeHtml(IMPROVE_FIELDS[d].ph)}" oninput="IMPROVE['${p}'].values['${d}']=this.value">${escapeHtml(st.values[d] || '')}</textarea>
    </div>`).join('');
  const relOpt = opts.offerRel ? `<label class="check-card" style="margin-bottom:10px"><input type="checkbox" ${st.addRel ? 'checked' : ''} onchange="IMPROVE['${p}'].addRel=this.checked"><span><strong>Add response guidelines</strong> asking AI to flag uncertainty and not invent facts. <span class="muted">Recommended because ${escapeHtml(opts.offerRel)}.</span></span></label>` : '';
  return `${fields}${relOpt}
    <button type="button" class="btn primary" onclick="showImproved('${p}')">Improve my prompt</button>
    <div id="${p}-improved" style="margin-top:16px">${st.shown ? improvedResultHTML(p) : ''}</div>`;
}
function showImproved(p){
  const st = IMPROVE[p]; if (!st) return;

        <div class="compare-col is-weak"><span class="compare-label">Weaker prompt</span><div class="bubble you">${escapeHtml(t.example.weak)}</div></div>
        <div class="compare-col is-strong"><span class="compare-label">Improved with ${escapeHtml(fw.name)}</span><div class="bubble you">${escapeHtml(t.example.improved)}</div></div>
      </div>
      <p class="muted small" style="margin:10px 0 0">Notice the improved prompt never says “${escapeHtml(fw.name)}”. The structure is visible in the instructions, not the label.</p>
    </section>

    <h2 class="section-title" id="try-it">Try it</h2>
    ${(B.goal || '').trim() ? `<div class="recommend small" style="margin-bottom:14px">You have a prompt in the Builder (“${escapeHtml(B.goal.slice(0, 70))}${B.goal.length > 70 ? '…' : ''}”). <button type="button" class="text-link" onclick="bToLab('${id}')">Bring it in</button>. We'll map your answers to ${escapeHtml(fw.name)}'s parts.</div>` : ''}
    <div class="workspace">
      <div>
        <div class="fields lab-fields">${rows}</div>
        <div style="margin-top:16px">${outputPanelHTML('lab', { saveFn:'labSave()', empty:'Fill in the parts above and your prompt will assemble here.', extraButtons:`<button type="button" class="btn ghost" onclick="labToReview()">Review the answer →</button><button type="button" class="btn ghost" onclick="labClear(this)">Clear form</button>` })}</div>
      </div>
      <aside class="side-sticky">
        <div class="readiness-panel-v2">
          <p class="rd-title" style="margin:0 0 10px">${escapeHtml(fw.name)} parts</p>
          <ul class="rd-list" id="lab-parts"></ul>
          <p class="muted small" style="margin:10px 0 0">You don't have to fill every part. Leave out anything that doesn't help this task.</p>
        </div>
        <div class="readiness-panel-v2" id="lab-readiness"></div>
      </aside>
    </div>
  </div>`;
  refreshLab();
}
/* ==========================================================================
   LEARN: the Prompt Ladder and short lessons. None are mandatory.
   ========================================================================== */
function lessonsDone(){ return store.get('lessonsDone', []); }
function markLesson(id, done){
  let d = lessonsDone().filter(x => x !== id); if (done) d.push(id); store.set('lessonsDone', d);
}
const SEVEN_QUESTIONS = [
  ['Goal','What do I want AI to do?'],['Context','What does it need to know?'],['Audience','Who is the answer for?'],['Requirements','What must it include?'],['Output','What should it look like?'],['Success','What would make it useful?'],['Constraints','What should it avoid?']
];
defineRoute('learn', (view, id) => {
  if (id && LESSONS[id]) return renderLesson(view, id);
  setTitle('Learn');
  const done = lessonsDone();
  view.innerHTML = `
  <div class="shell">
    <header class="page-hero">
      <p class="eyebrow">Learn</p>
      <h1>Short lessons, real skills</h1>
      <p class="lede">A few minutes each. Dip in wherever is useful. None are compulsory, and each one ends with something to try.</p>
    </header>
    <div class="grid-2" style="align-items:start">
      <section>
        <h2 class="section-title" style="margin-top:0">The Prompt Ladder</h2>
        <p class="section-intro">Prompting skills build on each other. Start at the bottom; most everyday tasks only need the first four rungs.</p>
        <ol class="ladder">${LADDER.map(l => `<li><a href="#/learn/${l.lesson}"><span class="lv">Level<b>${l.n}</b></span><span><span class="lt">${escapeHtml(l.title)}</span><span class="ld">${escapeHtml(l.desc)}</span></span>${done.includes(l.lesson) ? '<span class="done">✓ Done</span>' : '<span></span>'}</a></li>`).join('')}</ol>
      </section>
      <section class="panel">
        <h2 style="margin-top:0">Take it with you</h2>
        <p class="muted small">The goal is to not need this website. Before you write any important prompt, run through these questions in your head and answer the ones that matter for the task.</p>
        <ol style="padding-left:20px;margin:0 0 12px;line-height:1.9">${SEVEN_QUESTIONS.map(([k, q]) => `<li><strong>${escapeHtml(q)}</strong> <span class="muted small">(${escapeHtml(k)})</span></li>`).join('')}</ol>
        <p class="muted small" style="margin:0">Then: <strong>check the answer</strong>, and <strong>improve the prompt</strong> if it missed. That's the whole skill.</p>
        <div class="row" style="margin-top:12px"><button type="button" class="btn secondary small" onclick="copyText(SEVEN_QUESTIONS.map(([k,q],i)=>(i+1)+'. '+q+' ('+k+')').join('\\n')).then(()=>flashButton(this,'Copied ✓'))">Copy the checklist</button></div>
      </section>
    </div>
    <h2 class="section-title">All lessons</h2>
    <p class="section-intro">${done.length} of ${LESSON_SEQUENCE.length} done.</p>
    ${LESSON_GROUPS.map(g => `
      <h3 style="margin:22px 0 10px;font-size:1rem">${escapeHtml(g.title)}</h3>
      <div class="lesson-index">${g.ids.map(id => `<a class="lesson-link" href="#/learn/${id}"><span>${done.includes(id) ? '<span class="tick">✓</span> ' : ''}${escapeHtml(LESSONS[id].title)}</span><small>${LESSONS[id].mins} min</small></a>`).join('')}</div>`).join('')}
  </div>`;
});
function renderLesson(view, id){
  const L = LESSONS[id];
  setTitle(L.title);
  const i = LESSON_SEQUENCE.indexOf(id);
  const prev = LESSON_SEQUENCE[i - 1], next = LESSON_SEQUENCE[i + 1];
  const done = lessonsDone().includes(id);
  view.innerHTML = `
  <div class="shell">
    <a class="back-link" href="#/learn">← All lessons</a>
    <article class="lesson">
      <header class="page-hero" style="margin-top:14px">
        <p class="eyebrow">${L.ladder ? `Prompt Ladder · Level ${L.ladder} · ` : ''}${L.mins} min read</p>
        <h1>${escapeHtml(L.title)}</h1>
      </header>
      ${L.body}
      ${L.exercise ? `<section class="act-panel" style="margin-top:22px">${challengeHTML(L.exercise, 'Try it')}</section>` : ''}
      ${L.classify ? classifyHTML() : ''}
      <div class="takeaway"><strong>Key takeaway</strong>${escapeHtml(L.takeaway)}</div>
      ${L.tryIt ? `<p><a class="btn primary" href="${L.tryIt.href}">${escapeHtml(L.tryIt.label)} →</a></p>` : ''}
      <nav class="lesson-nav" aria-label="Lesson navigation">
        ${prev ? `<a class="btn ghost" href="#/learn/${prev}">← ${escapeHtml(LESSONS[prev].title)}</a>` : '<span></span>'}
        <button type="button" class="btn ${done ? 'secondary' : 'primary'}" onclick="markLesson('${id}', ${!done}); ${next && !done ? `go('#/learn/${next}')` : 'route()'}">${done ? '✓ Done (undo)' : next ? 'Mark as done & continue →' : 'Mark as done'}</button>
        ${next ? `<a class="btn ghost" href="#/learn/${next}">${escapeHtml(LESSONS[next].title)} →</a>` : '<span></span>'}
      </nav>
    </article>
  </div>`;
}
function classifyHTML(){
  const st = store.get('classify', { picks:{}, checked:false });
  const opts = Object.keys(CLASSIFY_LABELS);
  const right = CLASSIFY_ITEMS.filter((it, i) => st.picks[i] === it.answer).length;
  return `
    <section class="act-panel" style="margin-top:22px" id="classify">
      <p class="challenge-step-label">Try it · sort the statements</p>
      <p class="challenge-scenario">AI has given you an answer containing these statements. What kind of statement is each one?</p>
      <div class="stack">${CLASSIFY_ITEMS.map((it, i) => `
        <div class="review-q" style="grid-template-columns:1fr 200px">
          <label class="rq-text" for="cl-${i}" style="font-weight:500">${escapeHtml(it.text)}${st.checked ? `<small style="color:${st.picks[i] === it.answer ? 'var(--good)' : 'var(--warn)'}">${st.picks[i] === it.answer ? '✓ ' : '↻ It\'s ' + escapeHtml(CLASSIFY_LABELS[it.answer].toLowerCase()) + '. '}${escapeHtml(it.why)}</small>` : ''}</label>
          <select class="inp" id="cl-${i}" ${st.checked ? 'disabled' : ''} onchange="const s=store.get('classify',{picks:{},checked:false}); s.picks[${i}]=this.value; store.set('classify', s);">
            <option value="">Choose…</option>${opts.map(o => `<option value="${o}" ${st.picks[i] === o ? 'selected' : ''}>${escapeHtml(CLASSIFY_LABELS[o])}</option>`).join('')}
          </select>
        </div>`).join('')}</div>
      ${st.checked
        ? `<div class="challenge-feedback ${right === CLASSIFY_ITEMS.length ? 'is-correct' : 'is-incorrect'}" role="status"><span class="challenge-feedback-icon">${right === CLASSIFY_ITEMS.length ? '✓' : '↻'}</span><p class="challenge-feedback-text">${right} of ${CLASSIFY_ITEMS.length} right. The point isn't the score: it's noticing that one confident-sounding answer can mix very different kinds of statement.</p></div><button type="button" class="challenge-retry-btn" onclick="store.set('classify',{picks:{},checked:false}); route();">Try again</button>`
        : `<button type="button" class="btn primary" style="margin-top:12px" onclick="const s=store.get('classify',{picks:{},checked:false}); s.checked=true; store.set('classify', s); route(); setTimeout(()=>scrollToId('classify'),50);">Check my answers</button>`}
    </section>`;
}

/* ==========================================================================
   AI SAFETY: precise, contextual, not a wall of warnings
   ========================================================================== */
let clearArmed = false;
function clearMyData(btn){
  if (!clearArmed){ clearArmed = true; btn.textContent = 'Click again to delete everything'; setTimeout(() => { clearArmed = false; if (btn.isConnected) btn.textContent = 'Clear everything this site has stored'; }, 3000); return; }
  clearArmed = false;
  store.clearAll();
  btn.textContent = 'Done. Everything cleared';
  btn.disabled = true;
}
defineRoute('safety', (view) => {
  setTitle('AI safety');
  view.innerHTML = `
  <div class="shell">
    <header class="page-hero">
      <p class="eyebrow">AI safety</p>
      <h1>Using AI safely</h1>
      <p class="lede">What happens to what you type, here and in AI tools, and simple habits that keep personal and confidential information safe.</p>
    </header>

        <li><strong>Saved files go to your device</strong>, either the folder you choose or your normal downloads.</li>

      <h2>2. What happens when you paste a prompt into an AI tool</h2>
      <p>ChatGPT, Claude, Gemini, Copilot and similar tools are online services. <strong>The moment you send a prompt, that company receives it.</strong> Depending on the service, your plan and your settings, conversations may be:</p>
      <ul><li>stored, sometimes for a long time</li><li>reviewed by people for safety or quality</li><li>used to train future AI models (many services let you switch this off; check your settings)</li></ul>
      <p style="margin-bottom:0">Work and education accounts often have stronger protections than free personal accounts. If your organisation provides an approved AI tool, use that for work, sign in with your work account, and follow your organisation's AI policy.</p>

      <p>Once information has been sent to an outside service, you can't fully control where it goes. Be especially careful with:</p>

        <div><b>Security information</b>Passwords, access codes, account numbers. Never share these</div>
        <div><b>Confidential work</b>Unreleased plans, client data, contracts, anything marked confidential</div>
      </div>
    </section>
    <section class="panel">
      <h2>4. Use placeholders</h2>
      <p>Most of the time AI doesn't need the real details to help. Swap them for placeholders, then put the real details back into the answer yourself.</p>
      <div class="compare">
        <div class="compare-col is-weak"><span class="compare-label">Before</span><div class="bubble you placeholder-demo">Write a reply to Sarah Jones at Brightwater Ltd (sarah.jones@brightwater.co.uk) about the delayed £48,000 invoice.</div></div>
        <div class="compare-col is-strong"><span class="compare-label">After</span><div class="bubble you placeholder-demo">Write a reply to <span class="ph">[CLIENT]</span> at <span class="ph">[COMPANY]</span> about a delayed invoice of <span class="ph">[AMOUNT]</span>.</div></div>
      </div>
      <p class="muted small" style="margin:12px 0 0">The answer is just as useful. The builder on this site also spots things like email addresses, phone numbers and card numbers and offers to swap them for placeholders.</p>

      <h2>5. Check before you rely on it</h2>
      <p style="margin-bottom:0">AI can be wrong while sounding certain. A better prompt makes a useful answer more likely, but never guarantees it's correct. Check facts, figures, names, quotes and sources before you rely on or share them, especially for anything legal, medical or financial. <a class="text-link" href="#/learn/accuracy">Learn how</a>.</p>
