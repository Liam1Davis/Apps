<style>
/* ==========================================================================
   LD AI Prompt Builder: dyslexia-friendly edition
   Based on the British Dyslexia Association style guide:
   - off-white / tinted backgrounds, dark grey (not black) text
   - plain sans-serif, large size, generous letter / word / line spacing
   - left aligned, short line length, no italics, no ALL CAPS,
     underline only for links, bold for emphasis
   Every visual preference is a CSS variable the reader can change.
   ========================================================================== */
:root{
  --font: Verdana, Tahoma, "Segoe UI", Arial, sans-serif;
  --size: 19px;
  --lh: 1.65;
  --ls: .02em;
  --ws: .08em;
  --measure: 64ch;

  --bg:#FBF6EA;        /* cream */
  --panel:#FFFDF7;
  --text:#25252B;
  --muted:#4B4A55;
  --line:#DCD3C0;
  --accent:#1D4F91;    /* deep blue: buttons, links */
  --accent-text:#FFFFFF;
  --accent-soft:#E3ECF7;
  --hl:#FFE9A8;        /* highlight: reading ruler, read-aloud, key words */
  --good:#1E6B3A; --good-bg:#E3F2E6;
  --warn:#7A4A00; --warn-bg:#FCEFCF;
  --miss:#9B2C2C; --miss-bg:#F9E3E1;
  --shadow:0 2px 10px rgba(40,35,20,.08);
  --radius:14px;
}
/* Background tints (chosen in Reading settings) */
:root[data-tint="blue"]  { --bg:#E8F0F8; --panel:#F6FAFD; --line:#C9D6E4; }
:root[data-tint="yellow"]{ --bg:#FBF3CF; --panel:#FFFBEA; --line:#E2D59F; }
:root[data-tint="green"] { --bg:#E7F3E8; --panel:#F6FBF6; --line:#C6DCC8; }
:root[data-tint="peach"] { --bg:#FBE9DC; --panel:#FFF7F1; --line:#E8CDB8; }
:root[data-tint="grey"]  { --bg:#ECEBE8; --panel:#F8F7F5; --line:#D2D0CB; }
:root[data-tint="dark"]{
  --bg:#1D1C21; --panel:#28262E; --text:#F2E8D0; --muted:#E6D3A3; --line:#45414F;
  --accent:#E6D3A3; --accent-text:#1D1C21; --accent-soft:#3A3542;
  --hl:#5A4A1E;
  --good:#9FD8AE; --good-bg:#23382A; --warn:#F3CF86; --warn-bg:#3E3220; --miss:#F2A7A0; --miss-bg:#43262A;
  --shadow:none;
}
/* Fonts */
:root[data-font="arial"]   { --font: Arial, Helvetica, sans-serif; }
:root[data-font="century"] { --font: "Century Gothic", "Apple Gothic", Verdana, sans-serif; }
:root[data-font="comic"]   { --font: "Comic Sans MS", "Comic Neue", Verdana, sans-serif; }
:root[data-font="opendys"] { --font: OpenDyslexic, "OpenDyslexic", Verdana, sans-serif; }
/* Text size */
:root[data-size="s"] { --size:17px; }
:root[data-size="l"] { --size:21px; }
:root[data-size="xl"]{ --size:24px; }
/* Spacing */
:root[data-spacing="wide"]  { --lh:1.85; --ls:.05em; --ws:.16em; }
:root[data-spacing="xwide"] { --lh:2.05; --ls:.09em; --ws:.26em; }

*{box-sizing:border-box;}
html{font-size:var(--size);scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{transition:none !important;animation:none !important;} }
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:1rem;line-height:var(--lh);
  letter-spacing:var(--ls);word-spacing:var(--ws);
  text-align:left;
}
em,i,cite{font-style:normal;font-weight:700;}
h1,h2,h3,h4{line-height:1.3;letter-spacing:.01em;margin:0 0 .6em;color:var(--text);}
h1{font-size:1.9rem;}
h2{font-size:1.4rem;margin-top:1.4em;}
h3{font-size:1.15rem;}
p{margin:0 0 1em;max-width:var(--measure);}
ul,ol{margin:0 0 1em;padding-left:1.4em;max-width:var(--measure);}
li{margin-bottom:.5em;}
strong,b{font-weight:700;}
a{color:var(--accent);text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:2px;}
a:hover{text-decoration-thickness:3px;}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px;}
#view h1[tabindex="-1"]:focus{outline:none;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
[hidden]{display:none !important;}

/* ---------- Top bar ---------- */
.skip{position:absolute;left:-9999px;top:6px;z-index:200;background:var(--accent);color:var(--accent-text);padding:10px 16px;border-radius:10px;}
.skip:focus{left:10px;}
.top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:2px solid var(--line);box-shadow:var(--shadow);}
.top-inner{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;font-size:1.05rem;margin-right:auto;}
.brand-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;letter-spacing:0;}
.brand small{display:block;font-weight:400;font-size:.75rem;color:var(--muted);}
.tools{display:flex;gap:8px;flex-wrap:wrap;}
.nav{max-width:1120px;margin:0 auto;padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:6px;}
.nav a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--text);font-weight:700;font-size:.92rem;border:2px solid transparent;min-height:46px;}
.nav a:hover{border-color:var(--line);}
.nav a.current{background:var(--accent);color:var(--accent-text);}
.nav svg,.btn svg,.icon svg{width:1.2em;height:1.2em;flex:none;}
@media (max-width:760px){
  .nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:12px;}
  .nav a{flex:none;}
  .brand small{display:none;}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:10px 20px;
  border-radius:12px;border:2px solid var(--accent);background:var(--panel);color:var(--accent);
  font:inherit;font-weight:700;font-size:1rem;letter-spacing:inherit;word-spacing:inherit;cursor:pointer;text-decoration:none;text-align:left;
}
.btn:hover{background:var(--accent-soft);}
.btn.primary{background:var(--accent);color:var(--accent-text);}
.btn.primary:hover{filter:brightness(1.1);}
.btn.small{min-height:44px;padding:6px 14px;font-size:.9rem;}
.btn.quiet{border-color:var(--line);color:var(--text);}
.btn.big{min-height:64px;padding:14px 28px;font-size:1.15rem;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn.on{background:var(--accent);color:var(--accent-text);}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.row.between{justify-content:space-between;}
.stack{display:flex;flex-direction:column;gap:14px;}

/* ---------- Layout ---------- */
.page{max-width:1120px;margin:0 auto;padding:28px 18px 70px;}
.narrow{max-width:820px;}
.lede{font-size:1.15rem;max-width:var(--measure);}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow);}
@media (max-width:600px){ .card{padding:18px 16px;} .page{padding:20px 14px 60px;} h1{font-size:1.6rem;} }
.card > h2:first-child,.card > h3:first-child,.card-head h2,.card-head h3{margin-top:0;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
.route{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--text);}
.route:hover{border-color:var(--accent);}
.route .tag{align-self:flex-start;}
.route h3{margin:0;}
.route p{margin:0;flex-grow:1;}
.route .go{font-weight:700;color:var(--accent);}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--accent-soft);color:var(--text);font-weight:700;font-size:.85rem;}
.tag.good{background:var(--good-bg);color:var(--good);}
.tag.warn{background:var(--warn-bg);color:var(--warn);}
.big-idea{border-left:8px solid var(--accent);background:var(--accent-soft);padding:18px 20px;border-radius:12px;font-size:1.15rem;font-weight:700;margin:0 0 20px;max-width:none;}
.note{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:12px;background:var(--hl);color:var(--text);margin:0 0 18px;}
.note p{margin:0;}
.note .icon{flex:none;}
.warnbox{background:var(--warn-bg);color:var(--warn);}
.goodbox{background:var(--good-bg);color:var(--good);}
.muted{color:var(--muted);}
.small{font-size:.9rem;}
.icon{display:inline-flex;}
.kw{background:var(--hl);padding:0 .25em;border-radius:4px;font-weight:700;}

/* ---------- Listen buttons + highlight while reading aloud ---------- */
.listen{min-height:44px;padding:6px 14px;font-size:.9rem;border-color:var(--line);color:var(--text);}
.speaking{outline:4px solid var(--hl);outline-offset:6px;border-radius:8px;background:var(--hl);}
.listen.playing{background:var(--hl);border-color:var(--accent);}

/* ---------- Reading ruler ---------- */
#ruler{position:fixed;left:0;right:0;height:calc(var(--size) * var(--lh) * 1.6);pointer-events:none;z-index:40;
  background:rgba(255,225,120,.28);border-top:2px solid rgba(160,120,0,.45);border-bottom:2px solid rgba(160,120,0,.45);display:none;}
:root[data-ruler="on"] #ruler{display:block;}
:root[data-tint="dark"] #ruler{background:rgba(230,211,163,.16);border-color:rgba(230,211,163,.5);}

/* ---------- Reading settings panel ---------- */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:flex;justify-content:flex-end;}
.settings{width:min(460px,100%);height:100%;overflow-y:auto;background:var(--panel);color:var(--text);padding:22px 22px 40px;border-left:2px solid var(--line);}
.set-group{margin-bottom:22px;}
.set-group h3{margin:0 0 8px;font-size:1.05rem;}
.choices{display:flex;flex-wrap:wrap;gap:8px;}
.choice{font:inherit;letter-spacing:inherit;font-size:.95rem;min-height:48px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-weight:700;}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-text);}
.swatch{width:56px;height:48px;border-radius:12px;border:2px solid var(--line);cursor:pointer;font:inherit;font-size:.7rem;font-weight:700;color:#25252B;}
.swatch[aria-pressed="true"]{outline:4px solid var(--accent);outline-offset:2px;}

/* ---------- Steps ---------- */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;padding:0;list-style:none;}
.steps li{margin:0;}
.steps button{font:inherit;letter-spacing:inherit;font-size:.88rem;font-weight:700;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;}
.steps button.done{border-color:var(--good);color:var(--good);}
.steps button.now{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.steps button[disabled]{opacity:.55;cursor:default;}
.progress{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:0 0 8px;}
.progress span{display:block;height:100%;background:var(--accent);}

/* ---------- Prompts shown as speech bubbles ---------- */
.bubble{border-radius:14px;padding:16px 18px;margin:0 0 12px;white-space:pre-wrap;max-width:none;}
.bubble.you{background:var(--accent-soft);border:2px solid var(--line);}
.bubble.ai{background:var(--panel);border:2px dashed var(--line);}
.who{display:block;font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:4px;white-space:normal;}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:860px){ .compare{grid-template-columns:1fr;} }
.chunk{padding:.05em .25em;border-radius:5px;font-weight:700;}
.c1{background:#FFE08A;color:#25252B;} .c2{background:#BFE3C8;color:#25252B;} .c3{background:#C9DAF5;color:#25252B;} .c4{background:#F6CBB7;color:#25252B;} .c5{background:#E3D0F2;color:#25252B;}
.legend{list-style:none;padding:0;}
.legend li{margin-bottom:10px;}

/* ---------- Choice cards (quiz, chips) ---------- */
.options{display:flex;flex-direction:column;gap:12px;margin:0 0 16px;}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:2px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;}
.opt:hover{border-color:var(--accent);}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.opt.right{border-color:var(--good);background:var(--good-bg);}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg);}
.opt input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--accent);}
.opt-body{flex:1;}
.opt .listen{margin-top:8px;}
.feedback{padding:16px 18px;border-radius:12px;margin:0 0 14px;}
.feedback.good{background:var(--good-bg);color:var(--good);}
.feedback.warn{background:var(--warn-bg);color:var(--warn);}
.feedback p{margin:0;}
.remember{border-left:8px solid var(--accent);background:var(--accent-soft);padding:14px 18px;border-radius:10px;margin:0 0 16px;}
.remember p{margin:0;}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px;}
.chip{font:inherit;letter-spacing:inherit;word-spacing:inherit;font-size:.95rem;font-weight:700;min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;}
.chip:hover{border-color:var(--accent);}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.chip-label{font-weight:700;margin:14px 0 8px;display:block;}

/* ---------- Form fields ---------- */
label.field{display:block;font-weight:700;margin:0 0 8px;font-size:1.05rem;}
.hint{display:block;font-weight:400;color:var(--muted);font-size:.92rem;margin-top:2px;}
.inp{
  width:100%;font:inherit;letter-spacing:inherit;word-spacing:inherit;line-height:var(--lh);
  padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);
}
.inp:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
textarea.inp{resize:vertical;min-height:110px;}
select.inp{min-height:52px;}
.field-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.mic.listening{background:var(--miss-bg);border-color:var(--miss);color:var(--miss);}

/* ---------- Builder ---------- */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start;}
@media (max-width:980px){ .workspace{grid-template-columns:1fr;} }
.side{position:sticky;top:150px;display:flex;flex-direction:column;gap:16px;}
@media (max-width:980px){ .side{position:static;} }
.q-num{font-weight:700;color:var(--muted);margin:0 0 6px;}
.q-title{font-size:1.5rem;margin:0 0 10px;}
.why{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:0 0 16px;}
.why p{margin:0;}
.example{border:2px dashed var(--line);border-radius:12px;padding:12px 16px;margin:12px 0;}
.example p{margin:0;}
.nav-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:20px;}
.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0;}
.type-btn{font:inherit;letter-spacing:inherit;word-spacing:inherit;text-align:left;min-height:64px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;}
.type-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);}
.type-btn .ti{font-size:1.4rem;}

/* ---------- Readiness ---------- */
.rd-list{list-style:none;padding:0;margin:0 0 14px;}
.rd-item{display:grid;grid-template-columns:36px 1fr;gap:10px;margin:0 0 12px;align-items:start;}
.rd-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;letter-spacing:0;}
.rd-item.good .rd-icon{background:var(--good-bg);color:var(--good);}
.rd-item.warn .rd-icon{background:var(--warn-bg);color:var(--warn);}
.rd-item.miss .rd-icon{background:var(--miss-bg);color:var(--miss);}
.rd-item.optional .rd-icon{background:var(--line);color:var(--text);}
.rd-name{font-weight:700;display:block;}
.rd-why{display:block;font-size:.9rem;color:var(--muted);}
.verdict{display:inline-block;font-weight:700;padding:4px 14px;border-radius:999px;margin-bottom:10px;}
.verdict.ready{background:var(--good-bg);color:var(--good);}
.verdict.nearly{background:var(--warn-bg);color:var(--warn);}
.verdict.notyet{background:var(--line);color:var(--text);}
.meter{display:flex;gap:4px;margin:0 0 14px;}
.meter span{flex:1;height:12px;border-radius:6px;background:var(--line);}
.meter span.good{background:var(--good);}
.meter span.warn{background:var(--warn);}

/* ---------- Output ---------- */
.prompt-out{white-space:pre-wrap;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:18px;margin:0 0 14px;max-width:none;min-height:80px;}
.prompt-out.empty{border-style:dashed;border-color:var(--line);color:var(--muted);}
.status{min-height:1.5em;font-weight:700;}
.status.ok{color:var(--good);}
.status.err{color:var(--miss);}
details.more{border:2px solid var(--line);border-radius:12px;padding:0 16px;margin:0 0 16px;background:var(--panel);}
details.more summary{cursor:pointer;font-weight:700;padding:14px 0;min-height:48px;}
details.more[open] summary{border-bottom:2px solid var(--line);margin-bottom:12px;}
.kv{list-style:none;padding:0;margin:0 0 12px;}
.kv li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:8px 0;margin:0;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:700;}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap;}
.seg button{font:inherit;letter-spacing:inherit;font-weight:700;font-size:.92rem;min-height:46px;padding:6px 16px;border:0;background:var(--panel);color:var(--text);cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);}
.toggle-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border:2px solid var(--line);border-radius:12px;cursor:pointer;margin:0 0 12px;background:var(--panel);}
.toggle-card input{width:26px;height:26px;flex:none;margin-top:3px;accent-color:var(--accent);}
.toggle-card.on{border-color:var(--accent);background:var(--accent-soft);}

/* ---------- Review ---------- */
.rq{padding:16px 0;border-bottom:2px solid var(--line);}
.rq:last-child{border-bottom:0;}
.rq p{margin:0 0 10px;font-weight:700;}
.rq .hint{margin:-6px 0 10px;}
.answers{display:flex;flex-wrap:wrap;gap:8px;}
.finding{border:2px solid var(--line);border-left:8px solid var(--warn);border-radius:12px;padding:16px 18px;margin:0 0 14px;background:var(--panel);}
.finding.verify{border-left-color:var(--accent);}
.finding h3{margin:0 0 8px;}
.follow{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:8px 0;}
.follow p{margin:0 0 8px;}
.changes{list-style:none;padding:0;}
.changes li{border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;background:var(--panel);}

/* ---------- Learn ---------- */
.ladder{list-style:none;padding:0;margin:0;display:flex;flex-direction:column-reverse;gap:8px;max-width:none;}
.ladder li{margin:0;}
.ladder a{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--text);}
.ladder a:hover{border-color:var(--accent);}
.ladder .lv{font-weight:700;text-align:center;color:var(--accent);line-height:1.2;}
.ladder .lv b{display:block;font-size:1.5rem;}
.ladder .lt{font-weight:700;display:block;}
.ladder .ld{display:block;font-size:.9rem;color:var(--muted);}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
.lesson-link{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);text-decoration:none;font-weight:700;min-height:56px;}
.lesson-link:hover{border-color:var(--accent);}
.takeaway{border:3px solid var(--good);background:var(--good-bg);color:var(--good);border-radius:14px;padding:16px 18px;margin:22px 0;font-weight:700;max-width:var(--measure);}
.takeaway p{margin:0;}
.glossary dt{font-weight:700;margin-top:14px;}
.glossary dd{margin:4px 0 0;max-width:var(--measure);}

/* ---------- Lab ---------- */
.parts{list-style:none;padding:0;max-width:none;}
.parts li{border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 10px;background:var(--panel);}
.parts b{display:block;}
.lvl{font-weight:700;}

/* ---------- Footer ---------- */
footer{border-top:2px solid var(--line);padding:20px 18px 40px;max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);}
footer img{height:48px;width:auto;border-radius:5px;}
footer p{margin:0;}
footer .dev-credit{display:flex;align-items:center;gap:8px;}

@media print{ .top,.nav,footer,.listen,.field-tools,#ruler{display:none !important;} }
.swatch{width:auto;min-width:72px;padding:0 12px;}
/* On small screens the header scrolls away so it doesn't cover the text. */
@media (max-width:760px){ .top{position:static;} }
</style>

function escapeHtml(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function countWords(s){ const t = (s || '').trim(); return t ? t.split(/\s+/).length : 0; }
function prefersReducedMotion(){ return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function $(id){ return document.getElementById(id); }
function scrollToId(id){ const el = $(id); if (el) el.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block:'start' }); }
function sentence(s){ const t = (s || '').trim(); if (!t) return ''; const c = t.charAt(0).toUpperCase() + t.slice(1); return /[.!?:)"']$/.test(c) ? c : c + '.'; }
function lowerFirst(s){ const t = (s || '').trim(); if (!t) return ''; if (/^[A-Z]{2,}/.test(t) || /^I\b/.test(t)) return t; return t.charAt(0).toLowerCase() + t.slice(1); }
function stripEnd(s){ return (s || '').trim().replace(/[.!?]+$/, ''); }
function splitLines(s){ return (s || '').split(/\n|;\s+/).map(x => x.replace(/^\s*[-•*\d.)]+\s*/, '').trim()).filter(Boolean); }
function nowStamp(){ const n = new Date(); return `${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}, ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }

/* ---------- Storage (separate from the main site) ---------- */
const STORE_KEY = 'ldPromptBuilderDyslexia';
const store = (function(){
  let data = {};
  try { data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e){ data = {}; }
  return {
    get(k, d){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set(k, v){ data[k] = v; try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e){} },
    clearAll(){ data = {}; try { localStorage.removeItem(STORE_KEY); } catch(e){} }
  };
})();

  const p = prefs(), r = document.documentElement;
  r.setAttribute('data-tint', p.tint); r.setAttribute('data-font', p.font);
  r.setAttribute('data-size', p.size); r.setAttribute('data-spacing', p.spacing);

}

/* ==========================================================================
   Read aloud (text to speech). Uses the browser's built-in voices.
   ========================================================================== */
const TTS_OK = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let ttsQueue = [], ttsActiveBtn = null;
function pickVoice(){
  if (!TTS_OK) return null;
  const v = speechSynthesis.getVoices();
  return v.find(x => /en-GB/i.test(x.lang) && /natural|online|neural/i.test(x.name)) || v.find(x => /en-GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null;
}
function stopSpeaking(){
  if (!TTS_OK) return;
  ttsQueue = [];
  speechSynthesis.cancel();
  document.querySelectorAll('.speaking').forEach(e => e.classList.remove('speaking'));
  if (ttsActiveBtn){ ttsActiveBtn.classList.remove('playing'); ttsActiveBtn.innerHTML = ttsActiveBtn.getAttribute('data-orig'); ttsActiveBtn = null; }
}
function speakText(text, el){
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text.replace(/\s+/g, ' ').trim());
    const v = pickVoice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.rate = { slow:.8, normal:.95, fast:1.15 }[prefs().rate] || .95;
    if (el) el.classList.add('speaking');
    u.onend = u.onerror = () => { if (el) el.classList.remove('speaking'); resolve(); };
    speechSynthesis.speak(u);
  });
}
/* Reads a list of elements one after another, highlighting each. */
async function speakElements(els, btn){
  if (!TTS_OK){ alert('Reading aloud is not available in this browser. Try Chrome, Edge or Safari.'); return; }
  if (ttsActiveBtn === btn){ stopSpeaking(); return; }
  stopSpeaking();
  if (btn){ ttsActiveBtn = btn; btn.setAttribute('data-orig', btn.innerHTML); btn.classList.add('playing'); btn.innerHTML = icon('stop') + ' Stop'; }
  const token = {}; ttsQueue = [token];
  for (const el of els){
    if (ttsQueue[0] !== token) return;
    const t = (el.getAttribute('data-say') || el.innerText || '').trim();
    if (t) await speakText(t, el);
  }
  if (ttsQueue[0] === token) stopSpeaking();
}
const READABLE = 'h1,h2,h3,p,li,.bubble,dt,dd,.opt-body,.prompt-out,.big-idea,.takeaway';
function listenTo(targetId, btn){
  const host = $(targetId); if (!host) return;
  const els = [...host.querySelectorAll(READABLE)].filter(e => !e.closest('[aria-hidden="true"]') && !e.closest('.listen') && e.offsetParent !== null && !e.parentElement.closest(READABLE));
  speakElements(els.length ? els : [host], btn);
}
function listenBtn(targetId, label){ return TTS_OK ? `<button type="button" class="btn listen" onclick="listenTo('${targetId}', this)">${icon('speaker')} ${label || 'Listen'}</button>` : ''; }
function listenPage(btn){ listenTo('view', btn); }
if (TTS_OK && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => {};

/* ==========================================================================
   Voice typing (speech to text). Only offered where the browser supports it.
   In Chrome and Edge, audio is sent to Google or Microsoft to be turned
   into text, so we explain that once and ask before first use.
   ========================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recogField = null, recogBtn = null;
function micBtn(fieldId){
  return SR ? `<button type="button" class="btn small quiet mic" onclick="toggleMic('${fieldId}', this)">${icon('mic')} Speak instead</button>` : '';
}
function toggleMic(fieldId, btn){
  if (recog){ recog.stop(); return; }
  if (!store.get('micOk', false)){
    const ok = confirm('Voice typing turns your speech into text.\n\nIn Chrome and Edge, your voice is sent to Google or Microsoft to do this. Please don\'t say private details such as names, addresses or account numbers.\n\nUse voice typing?');
    if (!ok) return;
    store.set('micOk', true);
  }
  const field = $(fieldId); if (!field) return;
  recog = new SR(); recog.lang = 'en-GB'; recog.interimResults = false; recog.continuous = true;
  recogField = field; recogBtn = btn;
  btn.classList.add('listening'); btn.setAttribute('data-orig', btn.innerHTML); btn.innerHTML = icon('stop') + ' Stop listening';
  recog.onresult = e => {
    let add = '';
    for (let i = e.resultIndex; i < e.results.length; i++){ if (e.results[i].isFinal) add += e.results[i][0].transcript; }
    if (add){
      field.value = (field.value && !/\s$/.test(field.value) ? field.value + ' ' : field.value) + add.trim();
      field.dispatchEvent(new Event('input', { bubbles:true }));
    }
  };
  recog.onend = recog.onerror = () => {
    if (recogBtn){ recogBtn.classList.remove('listening'); recogBtn.innerHTML = recogBtn.getAttribute('data-orig'); }
    recog = null; recogBtn = null; recogField = null;
  };
  try { recog.start(); } catch(e){ recog.onend(); }
}

/* ---------- Copy and download ---------- */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(_){} document.body.removeChild(ta); return true; }
}
function flash(btn, label){ if (!btn) return; const o = btn.getAttribute('data-l') || btn.innerHTML; btn.setAttribute('data-l', o); btn.innerHTML = icon('tick') + ' ' + label; setTimeout(() => { btn.innerHTML = o; }, 1800); }
async function copyFrom(id, btn){
  const el = $(id); if (!el) return;
  const t = el.getAttribute('data-copy') != null ? el.getAttribute('data-copy') : el.textContent;
  if (!t.trim()){ flash(btn, 'Nothing to copy yet'); return; }
  await copyText(t); flash(btn, 'Copied');
}
function downloadText(text, statusId){
  if (!text.trim()){ setStatus(statusId, 'There is nothing to save yet.', 'err'); return; }
  const n = new Date(); const name = `Prompt-${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}-${String(n.getHours()).padStart(2,'0')}${String(n.getMinutes()).padStart(2,'0')}.txt`;
  const url = URL.createObjectURL(new Blob([text], { type:'text/plain' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  setStatus(statusId, `Saved to your downloads as ${name}.`, 'ok');
}
function setStatus(id, msg, kind){ const el = $(id); if (el){ el.textContent = msg; el.className = 'status ' + (kind || ''); } }

const ROUTES = {};

const NAV = [['home','#/','Home'],['start','#/start','Start here'],['build','#/build','Build'],['check','#/check','Check'],['review','#/review','Review'],['lab','#/lab','Prompt Lab'],['learn','#/learn','Learn'],['safety','#/safety','Safety']];
function renderNav(current){
  const n = $('nav'); if (!n) return;
  n.innerHTML = NAV.map(([k, h, l]) => `<a href="${h}" class="${k === current ? 'current' : ''}" ${k === current ? 'aria-current="page"' : ''}>${icon(k === 'home' ? 'home' : k)}<span>${l}</span></a>`).join('');
}
function route(){
  stopSpeaking();
  if (recog) recog.stop();
  const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  const parts = h.replace(/^\//, '').split('/');
  const name = ROUTES[parts[0]] ? parts[0] : 'home';
  const view = $('view'); view.innerHTML = '';
  ROUTES[name](view, parts[1] || null);
  renderNav(name);
  window.scrollTo(0, 0);
  const h1 = view.querySelector('h1');
  if (h1){ h1.setAttribute('tabindex','-1'); try { h1.focus({ preventScroll:true }); } catch(e){} }
}
window.addEventListener('hashchange', route);
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
function setTitle(t){ document.title = t ? `${t} · AI Prompt Builder: Dyslexia-friendly edition` : 'AI Prompt Builder: Dyslexia-friendly edition'; }

  ['document',  /\b(report|essay|article|blog|proposal|policy|document|guide|handbook|presentation|slides|newsletter|cv|résumé|resume|job (description|advert)|press release|briefing|case study|lesson plan|speech)\b/i],
  ['analyse',   /\b(analy[sz]e|analysis|compare|comparison|evaluate|assess|decide|decision|pros and cons|which (is|should)|should (i|we)|weigh up|review (my|our|this)|risks? of)\b/i],
  ['plan',      /\b(plan|schedule|itinerary|timetable|roadmap|agenda|strategy|routine|checklist|steps to)\b/i],
  ['explain',   /\b(explain|teach|help me understand|what is|what are|what's|how does|how do|why do|why does|why is|walk me through|learn about)\b/i],
  ['ideas',     /\b(ideas?|brainstorm|suggest|suggestions|names? for|options for|inspiration|recipes?|gift|things to do)\b/i]
];
function detectTaskType(text){
  const t = (text || '').trim();
  if (!t) return null;
  const shortQ = /\?\s*$/.test(t) && countWords(t) <= 12;
  for (const [type, re] of TYPE_PATTERNS){
    // Short questions ("What's the capital of Australia?") are just questions.
    if (shortQ && !['summarise','message','document'].includes(type)) return 'question';
    if (re.test(t)) return type;
  }
  if (/\?\s*$/.test(t) && countWords(t) <= 20) return 'question';
  return 'other';
}

/* High-stakes topics get task-specific quality controls. */
const RISK_PATTERNS = {
  health:    /\b(medical|medicine|medication|symptoms?|diagnos\w*|health|illness|disease|dose|dosage|pregnan\w*|mental health|treatment|nhs|gp)\b/i,
  legal:     /\b(legal|law|laws|lawyer|solicitor|contract|lease|tenancy|court|tribunal|lawsuit|liability|immigration|visa|gdpr|compliance|regulation)\b/i,
  financial: /\b(tax|taxes|invest\w*|pension|mortgage|loan|debt|financ\w*|savings|isa|shares|stocks|crypto|budget|insurance)\b/i,
  employment:/\b(disciplinary|grievance|redundan\w*|dismiss\w*|performance review|appraisal|sick leave|maternity|paternity|hr policy)\b/i
};
const FACTS_RE = /\b(statistics?|stats|data|research|sources?|cite|citations?|references?|studies|study|evidence|latest|current|recent|figures|facts?)\b/i;
const NUMBERS_RE = /\b(calculate|calculation|forecast|estimate|projection|cost|costs|price|pricing|revenue|profit|percent|percentage|roi)\b|%/i;

function detectRisks(text){
  const out = [];
  for (const k of Object.keys(RISK_PATTERNS)){ if (RISK_PATTERNS[k].test(text)) out.push(k); }
  return out;
}

/* ---------- Output chips (Control the output) ---------- */
const OUTPUT_CHIPS = {
  format: { label:'Format', items:{
    bullets:'bullet points', paras:'short paragraphs', steps:'numbered steps', table:'a table', headings:'clear headings', email:'email format with a subject line' } },
  length: { label:'Length', items:{
    vshort:'very short (under 100 words)', short:'short (about 150–250 words)', page:'about one page', detailed:'detailed and thorough' } },
  tone:   { label:'Tone & language', items:{
    friendly:'friendly', professional:'professional', formal:'formal', plain:'plain English, no jargon', encouraging:'encouraging', direct:'direct and to the point', uk:'UK English spelling' } }
};
function chipLabel(id){
  for (const g of Object.keys(OUTPUT_CHIPS)){ if (OUTPUT_CHIPS[g].items[id]) return OUTPUT_CHIPS[g].items[id]; }
  return '';
}
function outputPhrase(chips, text){
  const by = { format:[], length:[], tone:[] };
  (chips || []).forEach(id => { for (const g of Object.keys(OUTPUT_CHIPS)){ if (OUTPUT_CHIPS[g].items[id]) by[g].push(OUTPUT_CHIPS[g].items[id]); } });
  const parts = [];
  if (by.format.length) parts.push('Use ' + joinAnd(by.format) + '.');
  if (by.length.length) parts.push('Keep it ' + joinAnd(by.length) + '.');
  const tone = by.tone.filter(t => t !== 'UK English spelling');
  if (tone.length) parts.push('Tone: ' + joinAnd(tone) + '.');
  if (by.tone.includes('UK English spelling')) parts.push('Use UK English spelling.');
  if ((text || '').trim()) parts.push(sentence(text));
  return parts.join(' ');
}
function joinAnd(arr){
  if (arr.length <= 1) return arr.join('');
  return arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
}

/* ---------- 3a. Free-text detectors ----------
   Used for (a) prompts people paste in (Readiness checker, Review) and
   (b) spotting when one field already covers another dimension ("email to
   my manager" already names the audience), so learners aren't told to
   repeat themselves. Heuristic by design — the UI says so. */
const DETECTORS = {
  goal: /\b(write|draft|create|make|give|list|explain|summari[sz]e|help|plan|suggest|compare|analy[sz]e|tell|describe|generate|rewrite|translate|design|review|prepare|outline|find|calculate|recommend|produce|brainstorm|turn|convert|check|improve|edit|proofread|teach|show)\b/i,
  context: /\b(because|since|as i|as we|i am|i'm|we are|we're|i have|we have|i've|we've|background|currently|the situation|context|my (team|company|organisation|organization|business|job|role|class|school|project|department|situation)|our (team|company|organisation|organization|business|product|customers?|clients?)|for my|here (is|are) (my|the|our)|following (notes|text|information)|tomorrow|next week|deadline)\b/i,
  audience: /\b((ask|asking|tell|telling|email|emailing|message|messaging|reply to|replying to|write to|writing to|invite|inviting|thank|thanking|remind|reminding) (my|a|an|the|our) (manager|boss|team|client|customer|colleague|friend|teacher|landlord|tutor|line manager|director|staff|students?|parents?)|for (a |an |the |my |our )?([A-Z]{2,} )?(beginners?|starters|joiners|employees|volunteers|members|users|patients|candidates|applicants|leaders|teachers|pupils|residents|visitors|managers?|team|staff|colleagues?|clients?|customers?|students?|learners?|parents?|children|kids|executives?|board|stakeholders?|readers?|audience|public|non-?technical|experts?|newcomers?|someone|people who|year-olds?)|to (my|a|an|the|our) (manager|boss|team|client|customer|colleague|friend|teacher|landlord|tutor|line manager|hr|director)|audience|readers?|aimed at|pitched at|\d+-year-olds?|year-olds?|beginners?|non-?technical|little (previous |prior )?(\w+ )?(experience|knowledge)|no (prior|previous) (experience|knowledge))\b/i,
  requirements: /\b(include|including|cover|covering|mention|must|make sure|ensure|key points|at least|should contain|answer these|address|(\d+|three|two|four|five|six|seven|ten) (benefits|risks|examples|ideas|tips|points|reasons|options|steps|questions|recommendations|bullet points|key))\b/i,
  output: /\b(bullets?|bullet points|table|paragraphs?|\d+[ ,]*words?|words? (long|max|maximum)|sentences?|short|brief|concise|detailed|length|format|tone|headings?|numbered|step-by-step|subject line|one page|under \d+|no more than \d+|friendly|formal|informal|professional|polite|plain english|uk english|casual|warm)\b/i,
  success: /\b(so that|in order to|the goal is|my goal|our goal|the aim is|should help|needs? to (help|persuade|convince|explain|get|make)|outcome|success|so (i|we|they|my|our) (can|could|will)|to help (me|us|them)|purpose|useful for|i want (them|my|the reader) to)\b/i,
  constraints: /\b(avoid|don't|do not|without|only use|no jargon|not include|exclude|stay within|limit|must not|never|no more than|keep it under|within \d+|maximum|max\.? \d+|stick to)\b/i
};
function detectSnippet(dim, text){
  const re = DETECTORS[dim];
  if (!re) return null;
  const m = re.exec(text || '');
  if (!m) return null;
  const start = Math.max(0, m.index - 12), end = Math.min(text.length, m.index + m[0].length + 22);
  let snip = text.slice(start, end).replace(/\s+/g, ' ').trim();
  if (start > 0) snip = '…' + snip;
  if (end < text.length) snip += '…';
  return snip;
}

/* ---------- 3b. Readiness evaluation ----------
   Returns { type, items:[{dim, rel, status, label, why}], verdict, summary,
   keyCount, keyGood, skipped:[...] }. status: good | warn | miss | optional */
function evaluateFields(S){
  const type = S.type || detectTaskType(S.goal) || 'other';
  const rel = TASK_TYPES[type].rel;
  const all = [S.goal, S.context, S.audience, S.requirements, outputPhrase(S.outChips, S.outText), S.success, S.constraints].join(' \n ');
  const items = [];
  DIM_ORDER.forEach(dim => {
    if (rel[dim] === 'skip') return;
    const r = fieldStatus(dim, S, all);
    if (rel[dim] === 'opt' && r.status !== 'good') {
      items.push({ dim, rel:'opt', status:'optional', label: DIMENSIONS[dim].name + ' (optional)', why: optionalWhy(dim, type) });
      return;
    }
    items.push(Object.assign({ dim, rel:rel[dim] }, r));
  });
  return finishEvaluation(type, items, S);
}
function fieldStatus(dim, S, all){
  const D = DIMENSIONS[dim];
  const val = dim === 'output' ? outputPhrase(S.outChips, S.outText) : (S[dim] || '');
  const w = countWords(val);
  const covered = () => {
    // Is this dimension already covered somewhere else the learner wrote?
    const others = all.replace(val, ' ');
    const snip = detectSnippet(dim, others);
    if (!snip) return null;
    // A named reader is a strong signal; a passing "short" or "include" is only a partial answer.
    return dim === 'audience'
      ? { status:'good', label: D.good, why:`Already covered elsewhere in your prompt (“${snip}”), so no need to repeat it.` }
      : { status:'warn', label: D.warn, why:`Partly covered (“${snip}”). ${D.why}` };
  };
  if (dim === 'goal'){
    if (!w) return { status:'miss', label:D.miss, why:'Start by saying what you want AI to do. Everything else builds on this.' };
    if (w < 4) return { status:'warn', label:D.warn, why:'Say what you want produced and what it\'s about (e.g. “Write a short email to…” rather than “email”).' };
    return { status:'good', label:D.good, why:'AI knows what you want it to produce.' };
  }
  if (!w){
    if (dim !== 'context'){ const c = covered(); if (c) return c; }
    return { status:'miss', label:D.miss, why:D.why };
  }
  if (dim === 'context' && w < 6) return { status:'warn', label:D.warn, why:'A little more detail would help: the situation, key facts or what\'s already been decided.' };
  if (dim === 'audience' && /^(people|everyone|anyone|users?|the public)$/i.test(val.trim())) return { status:'warn', label:D.warn, why:'“Everyone” is hard to write for. Who is the main reader, and how much do they already know?' };
  if (dim === 'output' && (S.outChips || []).length === 1 && countWords(S.outText) < 3) return { status:'warn', label:D.warn, why:'You\'ve set one thing. Adding format or length as well usually makes the answer easier to use.' };
  if (dim === 'success' && w < 4) return { status:'warn', label:D.warn, why:'Describe what a good answer would let you or the reader do.' };
  return { status:'good', label:D.good, why: goodWhy(dim) };
}
function goodWhy(dim){
  return {
    context:'AI has the background it needs instead of guessing.',
    audience:'AI can pitch the language and detail at the right level.',
    requirements:'AI knows what a complete answer must contain.',
    output:'AI knows what the finished answer should look like.',
    success:'AI knows what the answer needs to achieve.',
    constraints:'AI knows what to avoid or stay within.'
  }[dim] || '';
}
function optionalWhy(dim, type){
  const t = TASK_TYPES[type].name.toLowerCase();
  return {
    context:'Optional here. Add background only if the answer depends on your situation.',
    audience:`Not essential to ${t}, but useful if someone else will read the result.`,
    requirements:'Optional. Add must-haves only if there are specific points to cover.',
    output:'Optional. Add a format or length if you have a preference.',
    success:'Optional. Useful if the answer has a specific job to do.',
    constraints:'Optional. Add limits only if there\'s something to avoid.'
  }[dim] || 'Optional for this task.';
}

/* Free-text version (Readiness checker / Review) */
function evaluateText(text, forcedType){
  const t = (text || '').trim();
  const type = forcedType || detectTaskType(t) || 'other';
  const rel = TASK_TYPES[type].rel;
  const words = countWords(t);
  const items = [];
  DIM_ORDER.forEach(dim => {
    if (rel[dim] === 'skip') return;
    const D = DIMENSIONS[dim];
    let r;
    const snip = detectSnippet(dim, t);
    if (dim === 'goal'){
      if (!words) r = { status:'miss', label:D.miss, why:'Write or paste a request to check it.' };
      else if (words < 4) r = { status:'warn', label:D.warn, why:'Very short requests leave AI to guess almost everything. Say what you want and what it\'s about.' };
      else if (!snip) r = { status:'warn', label:D.warn, why:'We couldn\'t spot a clear instruction (e.g. “Write…”, “Explain…”, “Compare…”). Starting with what you want AI to do helps.' };
      else r = { status:'good', label:D.good, why:`Clear instruction found (“${snip}”).` };
    } else if (dim === 'context'){
      if (snip && words >= 15) r = { status:'good', label:D.good, why:`Background found (“${snip}”).` };
      else if (words >= 30) r = { status:'good', label:D.good, why:'Plenty of specific detail for AI to work from.' };
      else if (snip || words >= 15) r = { status:'warn', label:D.warn, why:'There\'s a little background. A sentence on the situation or key facts would help AI more.' };
      else r = { status:'miss', label:D.miss, why:D.why };
    } else {
      r = snip ? { status:'good', label:D.good, why:`Found: “${snip}”.` } : { status:'miss', label:D.miss, why:D.why };
    }
    if (rel[dim] === 'opt' && r.status !== 'good') r = { status:'optional', label: D.name + ' (optional)', why: optionalWhy(dim, type) };
    items.push(Object.assign({ dim, rel:rel[dim] }, r));
  });
  return finishEvaluation(type, items, { goal:t });
}

function finishEvaluation(type, items, S){
  const keys = items.filter(i => i.rel === 'key');
  const keyGood = keys.filter(i => i.status === 'good').length;
  const gaps = keys.filter(i => i.status !== 'good');
  const misses = keys.filter(i => i.status === 'miss');
  const skipped = DIM_ORDER.filter(d => TASK_TYPES[type].rel[d] === 'skip').map(d => DIMENSIONS[d].name);
  let verdict, summary;
  const goalItem = items.find(i => i.dim === 'goal');
  if (!goalItem || goalItem.status === 'miss'){
    verdict = 'notyet';
    summary = 'Start with your goal: what do you want AI to do?';
  } else if (!gaps.length){
    verdict = 'ready';
    summary = type === 'question'
      ? 'Ready. This is a simple request, so a clear question is all it needs. Adding more wouldn\'t make it better.'
      : 'Ready. Your prompt gives AI the information this task needs. Remember to check the answer before you rely on it.';
  } else if (gaps.length <= 2 && misses.length <= 1 && keyGood >= Math.ceil(keys.length / 2)){
    verdict = 'nearly';
    summary = `Your prompt is nearly ready. Adding ${joinAnd(gaps.map(g => DIMENSIONS[g.dim].gap))} would help AI produce a more useful response.`;
  } else {
    verdict = 'notyet';
    summary = `Not ready yet. AI would have to guess ${joinAnd(gaps.slice(0, 3).map(g => DIMENSIONS[g.dim].gap))}${gaps.length > 3 ? ' and more' : ''}. Answer those and the response will be far more useful.`;
  }
  return { type, items, verdict, summary, keyCount:keys.length, keyGood, gaps:gaps.map(g => g.dim), skipped };
}
const VERDICT_LABEL = { ready:'Ready', nearly:'Nearly ready', notyet:'Not ready yet' };

function readinessHTML(ev, opts){
  opts = opts || {};
  const icon = { good:'✓', warn:'!', miss:'✕', optional:'–' };
  const keyItems = ev.items.filter(i => i.rel === 'key');
  const meter = keyItems.map(i => `<span class="${i.status === 'good' ? 'good' : i.status === 'warn' ? 'warn' : ''}"></span>`).join('');
  const list = ev.items.map(i => `
    <li class="rd-item ${i.status}">
      <span class="rd-icon" aria-hidden="true">${icon[i.status]}</span>
      <span><span class="rd-label">${escapeHtml(i.label)}</span>${opts.compact ? '' : `<span class="rd-why">${escapeHtml(i.why)}</span>`}</span>
    </li>`).join('');
  return `
    <div class="readiness" aria-live="polite">
      <div class="rd-head">
        <p class="rd-title">Prompt readiness</p>
        <span class="rd-verdict ${ev.verdict}">${VERDICT_LABEL[ev.verdict]}</span>
      </div>
      <div class="rd-meter" aria-hidden="true">${meter}</div>
      <p class="sr-only">${ev.keyGood} of ${ev.keyCount} key areas covered.</p>
      <ul class="rd-list">${list}</ul>
      <p class="rd-summary">${escapeHtml(ev.summary)}</p>
      ${ev.skipped.length ? `<p class="rd-skipped">Not needed for “${escapeHtml(TASK_TYPES[ev.type].name.toLowerCase())}”: ${escapeHtml(ev.skipped.join(', '))}. Leaving them out keeps the prompt focused.</p>` : ''}
    </div>`;
}

/* ---------- 4. Reliability layer ----------
   Behavioural guidance that encourages accuracy, transparency and
   appropriate uncertainty. It does NOT prevent hallucinations, and the UI
   never claims it does. Proportional: none → light → standard → enhanced. */
const RELIABILITY_STANDARD = [
  'Prioritise accuracy. Do not invent facts, figures, quotes, sources or links.',
  'If something is uncertain, unknown or cannot be checked, say so rather than presenting a guess as fact.',
  'Where it matters, make clear which points are facts, which are assumptions or estimates, and which are opinions.',
  '__FOLLOW__',
  'Use clear, direct language. Avoid filler, repetition and overconfident claims.',
  'If important information is missing and would significantly change your answer, ask me before guessing.'
];
const RELIABILITY_LIGHT = {
  message: 'Don\'t invent details I haven\'t given you (such as names, dates or figures). Use a [placeholder] where something is missing.',
  default: 'If you\'re not sure about something, say so rather than guessing.'
};
const RISK_CHECKS = {
  health:'This is a health-related topic. Give general information only, flag anything that depends on individual circumstances, and say when I should check with a pharmacist, GP or other qualified professional.',
  legal:'Laws and rules vary by country and change over time. Say which country\'s rules your answer assumes, and flag anything I should confirm with a qualified adviser or an official source.',
  financial:'Financial rules, rates and products change. Show the figures and assumptions behind any calculation, and flag anything I should confirm with an official source or a regulated adviser.',
  employment:'Workplace policies differ between organisations. Flag anything I should check against my organisation\'s own policy or with HR.'
};
const TASK_CHECKS = {
  facts:'Only mention sources, studies or statistics you are confident exist, and tell me which ones I should verify before relying on them.',
  numbers:'Show the key figures and assumptions behind any calculation or estimate so I can check them.'
};

function complexityOf(S, type){
  const filled = ['context','audience','requirements','success','constraints'].filter(d => (S[d] || '').trim()).length
    + ((S.outChips || []).length || (S.outText || '').trim() ? 1 : 0);
  const words = countWords([S.goal, S.context, S.requirements, S.success, S.constraints, S.outText, S.role, S.example].join(' '));
  let score = TASK_TYPES[type].weight + filled * 0.5 + (words > 90 ? 1 : 0) + (words > 180 ? 1 : 0);
  return { score, level: score < 2.5 ? 'simple' : score < 4.5 ? 'standard' : 'complex', words };
}

/* mode: auto | on | off. Returns { level, lines[], reasons[], title } */
function decideReliability(S, type, mode){
  const text = [S.goal, S.context, S.requirements, S.success, S.constraints, S.outText].join(' ');
  const risks = detectRisks(text);
  const facts = FACTS_RE.test(text);
  const numbers = NUMBERS_RE.test(text);
  const cx = complexityOf(S, type);
  const reasons = [];
  let level;
  if (mode === 'off'){
    return { level:'none', lines:[], reasons:['You switched the reliability layer off.'], risks, cx };
  }
  if (mode === 'on'){
    level = risks.length ? 'enhanced' : 'standard';
    reasons.push('You switched the reliability layer on.');
  } else if (risks.length){
    level = 'enhanced';
    reasons.push(`Your task touches on ${joinAnd(risks.map(r => ({health:'health',legal:'legal matters',financial:'money',employment:'employment matters'})[r]))}, where mistakes can matter, so extra checks were added.`);
  } else if (cx.level === 'simple'){
    if (type === 'ideas'){ level = 'none'; reasons.push('Simple creative tasks don\'t need accuracy rules. They would only add noise.'); }
    else { level = 'light'; reasons.push('This is a simple task, so a single line is enough. A full block would be over-engineering it.'); }
  } else if (['analyse','document','explain','summarise','plan','other'].includes(type) || facts || numbers){
    level = 'standard';
    reasons.push(cx.level === 'complex' ? 'This is a detailed task where accuracy matters, so the standard response guidelines were added.' : 'This task involves information AI could get wrong, so the standard response guidelines were added.');
  } else {
    level = 'light';
    reasons.push('A short reminder not to invent details is all this task needs.');
  }
  let lines = [];
  if (level === 'light'){
    lines = [type === 'message' ? RELIABILITY_LIGHT.message : RELIABILITY_LIGHT.default];
  } else if (level === 'standard' || level === 'enhanced'){
    const hasPrefs = (S.audience || '').trim() || (S.outChips || []).length || (S.outText || '').trim() || (S.constraints || '').trim();
    lines = RELIABILITY_STANDARD.map(l => l === '__FOLLOW__' ? (hasPrefs ? 'Follow the requirements above for audience, format, tone, length and anything to avoid.' : null) : l).filter(Boolean);
    if (facts) lines.push(TASK_CHECKS.facts);
    if (numbers) lines.push(TASK_CHECKS.numbers);
    if (level === 'enhanced') risks.forEach(r => lines.push(RISK_CHECKS[r]));
    if (facts || numbers) reasons.push(`Task-specific check added for ${joinAnd([facts ? 'sources and statistics' : null, numbers ? 'figures and calculations' : null].filter(Boolean))}.`);
  }
  return { level, lines, reasons, risks, cx };
}
const REL_LABEL = { none:'Not needed', light:'Light (one line)', standard:'Applied', enhanced:'Applied + extra checks' };

/* ---------- 5. Prompt assembly ----------
   Readable, proportional, no metadata. Simple tasks → one natural paragraph.
   Bigger tasks → short plain-English sections. Sections only appear when
   there's something to put in them. */
function assemblePrompt(S, rel){
  const type = S.type || detectTaskType(S.goal) || 'other';
  const cx = rel ? rel.cx : complexityOf(S, type);
  const out = outputPhrase(S.outChips, S.outText);
  const reqs = splitLines(S.requirements);
  const cons = splitLines(S.constraints);
  const role = (S.role || '').trim();
  const roleLine = role ? (/^you are\b/i.test(role) ? sentence(role) : `You are ${lowerFirst(stripEnd(role))}.`) : '';
  const relLines = rel ? rel.lines : [];
  if (!(S.goal || '').trim()) return '';

  const sectioned = cx.level !== 'simple' || reqs.length > 2 || countWords(S.context) > 45 || (S.example || '').trim();
  if (!sectioned){
    const bits = [];
    if (roleLine) bits.push(roleLine);
    bits.push(sentence(S.goal));
    if ((S.context || '').trim()) bits.push(sentence(S.context));
    if ((S.audience || '').trim()) bits.push(`It's for ${lowerFirst(stripEnd(S.audience))}.`);
    if (reqs.length) bits.push(`Make sure it includes ${joinAnd(reqs.map(r => lowerFirst(stripEnd(r))))}.`);
    if (out) bits.push(out);
    if ((S.success || '').trim()) bits.push(`A good answer will ${lowerFirst(stripEnd(S.success).replace(/^(a good answer (will|would)|it should)\s+/i, ''))}.`);
    if (cons.length) bits.push(cons.map(c => sentence(c)).join(' '));
    let p = bits.join(' ');
    if (relLines.length) p += '\n\n' + relLines.join(' ');
    return p;
  }
  const blocks = [];
  if (roleLine) blocks.push(roleLine);
  blocks.push(sentence(S.goal));
  if ((S.context || '').trim()) blocks.push('Background:\n' + sentence(S.context));
  if ((S.audience || '').trim()) blocks.push('Who it\'s for:\n' + sentence(S.audience));
  if (reqs.length) blocks.push('Make sure the answer includes:\n' + reqs.map(r => '- ' + sentence(r)).join('\n'));
  if ((S.success || '').trim()) blocks.push('What a good answer looks like:\n' + sentence(S.success));
  if (out) blocks.push('Format:\n' + out);
  if (cons.length) blocks.push('Please avoid / stay within:\n' + cons.map(c => '- ' + sentence(c)).join('\n'));
  if ((S.example || '').trim()) blocks.push('Here is an example of the kind of thing I mean (use it as a guide to style and level, not something to copy):\n"""\n' + S.example.trim() + '\n"""');
  if (relLines.length === 1) blocks.push(relLines[0]);
  else if (relLines.length) blocks.push('Response guidelines:\n' + relLines.map(l => '- ' + l).join('\n'));
  return blocks.join('\n\n');
}

  { id:'phone',   label:'a phone number',        ph:'[PHONE]',       re:/(?:\+44\s?7\d{3}|\b07\d{3})\s?\d{3}\s?\d{3}\b|\b0\d{2,4}[\s-]?\d{3,4}[\s-]?\d{3,4}\b/g },

  { id:'password',label:'a password',            ph:'[PASSWORD]',    re:/\b(password|passcode|pin)\s*(is|:|=)\s*\S+/gi }

function findPrivacyIssues(text){
  const hits = [];
  PRIVACY_PATTERNS.forEach(p => { p.re.lastIndex = 0; if (p.re.test(text || '')) hits.push(p); p.re.lastIndex = 0; });
  return hits;
}
function replaceWithPlaceholders(text, ids){
  let t = text || '';
  PRIVACY_PATTERNS.forEach(p => { if (!ids || ids.includes(p.id)){ p.re.lastIndex = 0; t = t.replace(p.re, p.ph); } });
  return t;
}
function privacyNoticeHTML(hits, fixFn){

/* ---------- 6b. Framework recommendation ---------- */
function recommendFramework(text, typeHint){
  const t = (text || '').toLowerCase();
  const type = typeHint || detectTaskType(t) || 'other';
  if (!t.trim()) return null;
  if (/\b(search|browse|look up|web|tool|api|database|spreadsheet lookup)\b/.test(t) && /\b(find|research|gather|book|check)\b/.test(t))
    return { id:'react', reason:'your task involves gathering information or taking actions step by step. ReAct structures a think → act → check loop. It only really works when the AI has tools such as web search.' };
  if (/\b(options?|alternatives?|approaches|which (is|should)|choose between|compare)\b/.test(t))
    return { id:'tot', reason:'you\'re choosing between several possible approaches. Tree-of-Thought asks AI to explore each option and judge them against clear criteria before recommending one.' };
  if (/\b(forecast|exactly|precise|calculate|accurate|double-check|verify)\b/.test(t) && type === 'analyse')
    return { id:'selfconsistency', reason:'getting one reliable answer matters here. Self-Consistency has AI solve the problem in more than one way and compare the results.' };
  if (/\b(design|build|model|strategy|framework|overhaul|from scratch|complex|multi-part)\b/.test(t) && ['plan','analyse','other','document'].includes(type))
    return { id:'leasttomost', reason:'this is a big problem that\'s easier to solve in smaller pieces. Least-to-Most breaks it down and builds up from the simplest part.' };
  if (type === 'analyse')
    return { id:'cot', reason:'your task needs reasoning, not just writing. Chain-of-Thought asks AI to work through the problem in stages before giving its answer.' };
  if (type === 'plan')
    return { id:'rise', reason:'your task is a process with an order to it. RISE (Role, Instructions, Steps, Expectations) makes the steps and the finished result explicit.' };
  if (['document','message','summarise','explain'].includes(type))
    return { id:'race', reason:'the quality of this task depends heavily on background information. RACE (Role, Action, Context, Expectations) puts the context front and centre.' };
  return { id:null, reason:'this looks like a simple request. You don\'t need a framework. A clear request that says what you want is enough.' };
}

const D_LESSONS = {
  'what-is-ai':{ title:'What is AI?', mins:2, body:`
<p>Tools like <b>ChatGPT</b>, <b>Claude</b>, <b>Gemini</b> and <b>Copilot</b> are AI tools.</p>
<p>You type or say a request. The AI writes an answer.</p>
<p>AI can write, explain, sum up and give ideas.</p>
<h2>Two things to remember</h2>
<ul><li><b>AI does not know your situation.</b> You need to tell it.</li><li><b>AI can be wrong.</b> It can sound sure, even when it is wrong.</li></ul>`,

  'what-is-a-prompt':{ title:'What is a prompt?', mins:2, body:`
<p>A <b>prompt</b> is what you type or say to AI.</p>
<p>“Give me three dinner ideas” is a prompt.</p>
<h2>Think of a new assistant</h2>
<p>Imagine a very clever assistant on their first day at work.</p>
<p>They can write and explain things. But they do not know you, your work or what you like.</p>
<p><b>The better you explain what you need, the better their work will be.</b></p>

  'why-answers-vary':{ title:'Why AI answers change', mins:2, body:`
<p>Ask AI the same thing twice. You will often get two different answers.</p>
<p>This is normal. AI picks its words with a little bit of chance.</p>
<ul><li><b>Clear prompts</b> give more steady answers.</li><li>If you do not like an answer, <b>ask again</b>.</li></ul>
<h2>A word you might see: temperature</h2>
<p>Some tools for developers have a setting called <b>temperature</b>. It controls how much the answers change.</p>
<p>It is a setting, <b>not</b> something you type in a chat.</p>`,
    takeaway:'Different answers are normal. Clear prompts help.' },
  'ai-helper':{ title:'AI as your reading and writing helper', mins:3, body:`
<p>AI can be a great helper if reading or writing takes you extra effort.</p>
<h2>Things you can ask AI to do</h2>
<ul>
<li><b>Make a letter simpler:</b> “Explain this letter in simple words. Tell me what I need to do.”</li>
<li><b>Sum up a long document:</b> “Sum this up in five bullet points.”</li>
<li><b>Check your spelling:</b> “Correct the spelling and grammar. Do not change my meaning.”</li>
<li><b>Turn notes into an email:</b> “Turn these notes into a polite email.”</li>
<li><b>Break a big job into steps:</b> “Break this task into small steps.”</li>
<li><b>Plan your time:</b> “Help me plan my week. I have these deadlines.”</li>
</ul>
<h2>Good news about spelling</h2>
<p><b>AI is very good at understanding spelling mistakes.</b> Focus on what you want to say. Do not worry about spelling.</p>
<h2>Speak instead of typing</h2>
<p>Many AI apps let you <b>talk</b> instead of type. Look for the microphone button.</p>
<p>On Windows, press the <b>Windows key + H</b> to type with your voice in most apps.</p>
<h2>Stay safe</h2>
<p>Take out names, addresses and account numbers before you paste a letter into AI.</p>
<p>Always check important numbers, names and dates in AI's answer.</p>`,
    takeaway:'AI can read, sum up, check and plan with you. You stay in charge, and you check what matters.', tryIt:['#/build','Try it in the builder'] },
  'tell-ai':{ title:'Tell AI how you like to read', mins:2, body:`
<p>You can ask AI to write in a way that suits you.</p>
<p>Add a line like this to your prompt:</p>
<p class="bubble you">Make it easy to read: use short sentences and everyday words, put the most important point first, use headings and bullet points, and keep paragraphs short.</p>
<p>The builder on this site can add this line for you. Just tick the box.</p>
<h2>Set it once</h2>
<p>Some AI tools let you save this, so you do not have to type it every time.</p>
<ul><li>In <b>ChatGPT</b>: look for <b>Customise ChatGPT</b> or <b>Personalisation</b> in settings.</li><li>In <b>Claude</b>: look for <b>Profile preferences</b> in settings.</li><li>In <b>Copilot</b> or <b>Gemini</b>: look for a <b>personalisation</b> or <b>instructions</b> setting.</li></ul>
<p>Menus change over time. If you cannot find it, ask the AI: “How do I save instructions for every chat?”</p>

  'clear-task':{ title:'Say what you want', mins:2, ladder:1, body:`
<p>Start with what you want AI to <b>do</b>.</p>
<p>Use an action word: <b>write</b>, <b>explain</b>, <b>sum up</b>, <b>compare</b>, <b>plan</b>.</p>

  'context':{ title:'Give background', mins:2, ladder:2, body:`
<p><b>Background</b> is what AI needs to know about your situation.</p>

  'audience':{ title:'Say who it is for', mins:2, ladder:2, body:`
<p>Who will read the answer? Say so.</p>
<p>“For my manager.” “For a customer.” “For me. I am new to this.”</p>
<p>AI will then pick the right words and tone.</p>`, exercise:'audience', takeaway:'Say who will read it, and what they already know.' },
  'requirements':{ title:'Say what it must include', mins:2, ladder:3, body:`
<p>List the things that <b>must</b> be in the answer.</p>
<p>For example: “Include the date, the reason and what happens next.”</p>
<p>Only list what really matters.</p>`, takeaway:'List the must-haves.' },
  'outcome':{ title:'Say what it is for', mins:2, ladder:3, body:`
<p>What do you need the answer to <b>do</b>?</p>
<p>“So my manager can say yes quickly.” “So I can decide by Friday.”</p>
<p>This helps AI know what matters most.</p>
<p>It also helps you check the answer later.</p>`, takeaway:'Say what the answer needs to help with.' },
  'output':{ title:'Say how it should look', mins:2, ladder:4, body:`
<p>Tell AI how the answer should look.</p>
<ul><li><b>Format:</b> bullet points, a table, steps, an email.</li><li><b>Length:</b> “under 100 words”, “five bullet points”.</li><li><b>Tone:</b> friendly, formal, simple.</li></ul>
<p>If you do not say, AI often writes too much.</p>`, exercise:'output', takeaway:'Format, length and tone make the answer easy to use.' },
  'examples':{ title:'Show an example', mins:2, ladder:5, body:`
<p>Sometimes it is easier to <b>show</b> AI what you want.</p>
<p class="bubble you">Write three more product descriptions like this one:\n"Our oak board is cut from one piece of wood. Heavy enough to stay put. Light enough to lift."</p>
<ul><li>Say what the example is for: “use the same style”.</li><li>Check the example for private details first.</li></ul>`, takeaway:'Show an example when it is hard to explain.' },
  'evaluate':{ title:'Check the answer', mins:2, ladder:6, body:`
<p>When AI answers, ask yourself:</p>
<ul><li>Did it answer my question?</li><li>Did it use my facts?</li><li>Does it look right?</li><li>Is anything missing?</li><li>Is it easy to read?</li><li>Does anything need checking?</li></ul>
<p>Each “no” tells you what to add to your prompt.</p>`, exercise:'verify', takeaway:'A disappointing answer tells you what your prompt was missing.', tryIt:['#/review','Review an answer'] },
  'improve':{ title:'Improve it', mins:2, ladder:7, body:`
<p>You do not need to start again.</p>
<h2>1. Reply in the same chat</h2>
<p>AI remembers the chat. Short replies work well:</p>
<ul><li>“Make it shorter.”</li><li>“Use simpler words.”</li><li>“Add a part about costs.”</li></ul>
<h2>2. Fix your prompt</h2>
<p>If you will use the prompt again, add what was missing.</p>
<p>Notice what you had to add. Next time, add it at the start.</p>`, takeaway:'Reply to fix small things. Fix the prompt for next time.', tryIt:['#/review','Use Prompt Review'] },
  'accuracy':{ title:'Is it true? Facts and guesses', mins:3, body:`
<p><b>A good prompt makes a useful answer more likely. It does not make it always correct.</b></p>
<p>AI can make mistakes. It can even make up facts or sources.</p>
<h2>Kinds of statement</h2>
<ul><li><b>Fact:</b> you can check it.</li><li><b>Your information:</b> something you told AI.</li><li><b>Guess:</b> AI filled a gap.</li><li><b>Estimate:</b> a rough number.</li><li><b>Opinion:</b> a view or advice.</li><li><b>Not sure:</b> AI says it does not know.</li></ul>
<h2>Always check</h2>
<p>Numbers, names, dates, quotes and links. Check anything about health, law or money.</p>`, classify:true, takeaway:'Good prompts help. Checking is still your job.' },
  'when-not':{ title:'Keep it simple', mins:2, body:`
<p><b>Sometimes the best prompt is just a clear question.</b></p>
<p>“Give me three dinner ideas using chicken and rice.” That is enough.</p>
<p>A good prompt is <b>clear</b>, <b>useful</b> and <b>right for the task</b>. It does not need to be long.</p>
<ul><li>Simple task: one clear sentence.</li><li>Someone else will read it: say who.</li><li>It matters if it is wrong: add facts and ask AI to be careful.</li></ul>`, exercise:'proportion', takeaway:'Longer is not better. Match the prompt to the task.' },
  'frameworks':{ title:'What are frameworks?', mins:2, ladder:8, body:`
<p>A <b>framework</b> is a ready-made structure for a prompt.</p>
<p>For example, <b>RACE</b> stands for Role, Action, Context, Expectations.</p>
<p>Frameworks use the same parts you already know: what you want, background, who it is for, and how it should look.</p>
<p class="big-idea">The framework helps <b>you</b> remember what to include. AI does not need to know which one you used.</p>
<p>You do not need a framework for most tasks.</p>`, exercise:'role', takeaway:'Frameworks are checklists for you. Use one only when it helps.', tryIt:['#/lab','Explore the Prompt Lab'] },
  'advanced':{ title:'Useful words to know', mins:3, body:`
<dl class="glossary">
<dt>Custom instructions</dt><dd>Settings that AI follows in every chat. Good for “make it easy to read”.</dd>
<dt>Tokens</dt><dd>Small pieces of text that AI reads. Very long documents may be too big.</dd>
<dt>Temperature</dt><dd>A developer setting that changes how varied answers are. Not something you type in a chat.</dd>
<dt>Hallucination</dt><dd>When AI makes something up and sounds sure about it.</dd>
<dt>Thinking mode</dt><dd>Some AI tools can “think” longer before answering. Useful for hard problems.</dd>

</dl>`, takeaway:'You do not need these words to use AI well. They help when you read about AI.' }

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const QZ_ORDER = {}; Object.keys(D_EXERCISES).forEach(id => { QZ_ORDER[id] = shuffle(D_EXERCISES[id].options.map(o => o.k)); });
const QZ_AFTER = {};
function qzState(id){ return (store.get('qz', {}))[id] || { sel:null, done:false }; }
function qzSave(id, s){ const all = store.get('qz', {}); all[id] = s; store.set('qz', all); }
function quizHTML(id){ return `<div id="qz-${id}">${quizInner(id)}</div>`; }
function quizInner(id){
  const ex = D_EXERCISES[id], s = qzState(id);
  const chosen = ex.options.find(o => o.k === s.sel);
  const opts = QZ_ORDER[id].map((k, i) => {
    const o = ex.options.find(x => x.k === k);
    let cls = s.sel === k ? ' sel' : '';
    if (s.done) cls = o.ok ? ' right' : (s.sel === k ? ' wrong' : '');
    return `<label class="opt${cls}" for="qz-${id}-${k}">
      <input type="radio" name="qz-${id}" id="qz-${id}-${k}" ${s.sel === k ? 'checked' : ''} ${s.done ? 'disabled' : ''} onchange="qzPick('${id}','${k}')">
      <span class="opt-body"><span class="who">Option ${i + 1}</span><span id="qz-${id}-${k}-t">${escapeHtml(o.text)}</span></span>
    </label>`;
  }).join('');
  return `
    <div id="qz-${id}-read">
      <h2 style="margin-top:0">${escapeHtml(ex.title)}</h2>
      <p>${escapeHtml(ex.task)}</p>
      <p><b>${escapeHtml(ex.question)}</b></p>
    </div>
    <div class="row" style="margin-bottom:12px">${listenBtn('qz-' + id, 'Listen to the question and options')}</div>
    <fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">${escapeHtml(ex.question)}</legend><div class="options">${opts}</div></fieldset>
    ${s.done ? '' : `<button type="button" class="btn primary" onclick="qzCheck('${id}')" ${s.sel ? '' : 'disabled'} id="qz-${id}-check">Check my answer</button>`}
    ${s.done && chosen ? `<div class="feedback ${chosen.ok ? 'good' : 'warn'}" role="status" id="qz-${id}-fb"><p><b>${chosen.ok ? '✓ ' : ''}</b>${escapeHtml(chosen.fb)}</p>${chosen.ok ? '' : `<p style="margin-top:8px">The best option is shown in green.</p>`}</div>
      <div class="remember"><p><b>Remember:</b> ${ex.remember}</p></div>
      <div class="row">${listenBtn('qz-' + id + '-fb', 'Listen to the feedback')}${chosen.ok ? '' : `<button type="button" class="btn quiet small" onclick="qzSave('${id}',{sel:null,done:false}); qzRender('${id}')">Try again</button>`}</div>` : ''}
    <div style="margin-top:14px">${s.done && QZ_AFTER[id] ? QZ_AFTER[id]() : ''}</div>`;
}
function qzRender(id){ const el = $('qz-' + id); if (el) el.innerHTML = quizInner(id); }
function qzPick(id, k){
  const s = qzState(id); if (s.done) return; s.sel = k; qzSave(id, s);
  document.querySelectorAll(`#qz-${id} .opt`).forEach(o => o.classList.toggle('sel', o.querySelector('input').checked));
  const b = $(`qz-${id}-check`); if (b) b.disabled = false;
}
function qzCheck(id){ const s = qzState(id); if (!s.sel) return; s.done = true; qzSave(id, s); qzRender(id); const f = $(`qz-${id}-fb`); if (f) f.focus && f.setAttribute('tabindex','-1'); }

function readinessBlock(ev, id){

    <div id="${id}">

      <div class="meter" aria-hidden="true">${keys.map(i => `<span class="${i.status === 'good' ? 'good' : i.status === 'warn' ? 'warn' : ''}"></span>`).join('')}</div>
      <p class="sr-only">${ev.keyGood} of ${ev.keyCount} key parts done.</p>
      <p><b>${escapeHtml(ev.summary)}</b></p>
      <ul class="rd-list">${ev.items.map(i => `<li class="rd-item ${i.status}"><span class="rd-icon" aria-hidden="true">${icons[i.status]}</span><span><span class="rd-name">${PLAIN_DIMS[i.dim].icon} ${escapeHtml(i.label)}</span><span class="rd-why">${escapeHtml(i.why)}</span></span></li>`).join('')}</ul>

}

/* ---------- Fill the gaps (never rewrites the learner's words) ---------- */
const GAP_PH = { goal:'For example: a short email asking for tomorrow off', context:'For example: I have an appointment in the morning.', audience:'For example: my manager', requirements:'For example: the date and the reason', output:'For example: short, friendly, bullet points', success:'For example: so my manager can say yes quickly', constraints:'For example: no jargon' };
const GAP_PREFIX = { goal:'What I want is: ', context:'Background: ', audience:'Who it is for: ', requirements:'Please include: ', output:'Format: ', success:'This answer needs to: ', constraints:'Please avoid: ' };
const GAPS = {};
function gapsHTML(p, base, dims, offerRel){
  const st = GAPS[p] = (GAPS[p] && GAPS[p].base === base) ? Object.assign(GAPS[p], { dims }) : { base, dims, vals:{}, rel:false, easy:false };
  if (!dims.length && !offerRel) return `<p>Nothing important is missing for this kind of task.</p>`;
  return `
    <p>Fill in only the boxes that help. We add your words to the end of your prompt. <b>We do not change what you wrote.</b></p>
    ${dims.map(d => `<div class="card" style="box-shadow:none">
      <label class="field" for="${p}-g-${d}">${PLAIN_DIMS[d].icon} ${escapeHtml(PLAIN_DIMS[d].q)}<span class="hint">${escapeHtml(PLAIN_DIMS[d].why)}</span></label>
      <textarea class="inp" id="${p}-g-${d}" rows="2" placeholder="${escapeHtml(GAP_PH[d])}" oninput="GAPS['${p}'].vals['${d}']=this.value">${escapeHtml(st.vals[d] || '')}</textarea>
      <div class="field-tools">${micBtn(`${p}-g-${d}`)}</div></div>`).join('')}
    <label class="toggle-card${st.easy ? ' on' : ''}"><input type="checkbox" ${st.easy ? 'checked' : ''} onchange="GAPS['${p}'].easy=this.checked; this.parentNode.classList.toggle('on', this.checked)"><span><b>Ask AI to make its answer easy to read</b><br><span class="small">Short sentences, everyday words, headings and bullet points.</span></span></label>
    ${offerRel ? `<label class="toggle-card${st.rel ? ' on' : ''}"><input type="checkbox" ${st.rel ? 'checked' : ''} onchange="GAPS['${p}'].rel=this.checked; this.parentNode.classList.toggle('on', this.checked)"><span><b>Ask AI to be careful with facts</b><br><span class="small">Suggested because ${escapeHtml(offerRel)}.</span></span></label>` : ''}
    <button type="button" class="btn primary big" onclick="showGaps('${p}')">Improve my prompt</button>
    <div id="${p}-improved" style="margin-top:18px"></div>`;
}
function showGaps(p){
  const st = GAPS[p];
  st.dims.forEach(d => { const el = $(`${p}-g-${d}`); if (el) st.vals[d] = el.value; });
  const added = st.dims.filter(d => (st.vals[d] || '').trim());
  const box = $(p + '-improved');
  if (!added.length && !st.rel && !st.easy){ box.innerHTML = `<p class="status err">Fill in at least one box first. We only add what you tell us.</p>`; return; }
  let text = st.base.trim() + (added.length ? '\n\n' + added.map(d => GAP_PREFIX[d] + sentence(st.vals[d])).join('\n') : '');
  if (st.easy) text += '\n\n' + EASY_READ_LINE;
  if (st.rel) text += '\n\nPlease be careful with facts. Do not make things up. If you are not sure about something, say so.';
  const log = added.map(d => `<li><b>We added: ${escapeHtml(PLAIN_DIMS[d].name)}</b><br>${escapeHtml(st.vals[d].trim())}<br><span class="small"><b>Why:</b> ${escapeHtml(PLAIN_DIMS[d].why)}</span></li>`).join('')
    + (st.easy ? `<li><b>We added: easy-to-read request</b><br><span class="small"><b>Why:</b> AI will write in a way that is easier for you to read.</span></li>` : '')
    + (st.rel ? `<li><b>We added: be careful with facts</b><br><span class="small"><b>Why:</b> It asks AI not to guess. It cannot stop every mistake.</span></li>` : '');
  box.innerHTML = `
    <h2>What we changed</h2>
    <ul class="changes">${log}</ul>
    <h2>Your improved prompt</h2>
    <div class="prompt-out" id="${p}-imp-text">${escapeHtml(text)}</div>
    <div class="row"><button type="button" class="btn primary" onclick="copyFrom('${p}-imp-text', this)">${icon('copy')} Copy improved prompt</button>${listenBtn(p + '-imp-text', 'Listen')}</div>
    <p class="small muted" style="margin-top:12px">Next time, try adding these at the start.</p>`;
  scrollToId(p + '-improved');
}

/* ==========================================================================

function carefulReason(text, flags){
  if (/be careful with facts|do not make things up|don't make things up|response guidelines/i.test(text)) return null;
  const r = detectRisks(text);
  if (r.length) return 'your task is about ' + joinAnd(r.map(x => ({ health:'health', legal:'the law', financial:'money', employment:'work rules' })[x]));
  if (flags && flags.assume) return 'AI guessed things';
  if (flags && flags.verify) return 'the answer had things to check';
  return null;

function rvRun(){
  const p = $('rv-prompt').value; store.set('rvPrompt', p);
  const st = store.get('rv', {}), out = $('rv-out');
  if (!Object.keys(st).length){ out.innerHTML = `<p class="status err">Answer at least one question first.</p>`; return; }
  const found = D_REVIEW.filter(q => st[q.id] && q.bad.includes(st[q.id]));
  const unsure = D_REVIEW.filter(q => !q.verify && st[q.id] === 'unsure');
  const ev = p.trim() ? evaluateText(p) : null;
  const dims = [];
  found.forEach(q => { if (q.dim && !dims.includes(q.dim)) dims.push(q.dim); });
  if (unsure.length && !dims.includes('success')) dims.push('success');
  if (ev) ev.gaps.forEach(d => { if (!dims.includes(d)) dims.push(d); });
  const flags = { assume:found.some(q => q.id === 'assume'), verify:found.some(q => q.id === 'verify') };
  out.innerHTML = `
    <h2>What we found</h2>
    ${!found.length && !unsure.length ? `<div class="feedback good"><p>✓ It sounds like the answer did its job. Still check anything important before you use it.</p></div>` :
      found.map(q => `<div class="finding${q.verify ? ' verify' : ''}" id="f-${q.id}">
